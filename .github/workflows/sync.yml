name: Sync Check

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: YuzuMikan404/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Check for updates
        run: |
          echo "--- Start checking for updates ---"
          
          if [ -z "$MY_PAT" ]; then
            echo "::error::Secret 'PAT' is not set."
            exit 1
          fi

          # 修正ポイント: コマンドを変数に入れず、認証URLだけ変数にする
          # これでクォートの問題を回避できます
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          
          echo "Fetching tags from remote ($SOURCE_REPO)..."
          
          # 修正ポイント: gitコマンドを直接実行する
          # --sort=v:refname のクォートを外していますが、直接実行ならこれで正しく解釈されます
          if ! REMOTE_OUTPUT=$(git ls-remote --tags --sort=v:refname "$AUTH_URL" 2>&1); then
             echo "::error::Failed to access remote repository."
             echo "--- Error Details ---"
             echo "Message: $REMOTE_OUTPUT"
             exit 1
          fi

          # 最新タグを取得 (refs/tags/v1.0.0 -> v1.0.0)
          REMOTE_TAGS=$(echo "$REMOTE_OUTPUT" | tail -n 1 | awk -F/ '{print $3}')
          
          if [ -z "$REMOTE_TAGS" ]; then
             REMOTE_TAGS="none"
          fi
          
          echo "Latest Remote Tag: $REMOTE_TAGS"
          
          # ローカルタグ取得
          LOCAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current Local Tag: $LOCAL_TAG"
          
          # 比較ロジック
          if [ "$REMOTE_TAGS" != "none" ] && [ "$REMOTE_TAGS" != "$LOCAL_TAG" ]; then
            echo "UPDATE_AVAILABLE=true" >> $GITHUB_ENV
            echo "New version found! ($REMOTE_TAGS)"
          else
            echo "UPDATE_AVAILABLE=false" >> $GITHUB_ENV
            echo "Already up to date."
          fi

name: Sync Check

permissions:
  contents: write # 念のため書き込み権限も明示

on:
  schedule:
    - cron: '0 0 * * *' # 毎日実行など（必要に応じて変更）
  workflow_dispatch: # 手動実行用

jobs:
  check-update:
    runs-on: ubuntu-latest
    env:
      # 正しいリポジトリ名 (スペルはPrtivateで正解)
      SOURCE_REPO: YuzuMikan404/PrtivateLIMEs
      # 【重要】ここを secrets.GITHUB_TOKEN から secrets.PAT に変更します
      MY_PAT: ${{ secrets.PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout自体もPATを使って行うことで、サブモジュール等がある場合も安心です
          token: ${{ secrets.PAT }}

      - name: Check for updates
        run: |
          echo "--- Start checking for updates ---"
          
          # 注意: トークンが無い場合はエラーにする
          if [ -z "$MY_PAT" ]; then
            echo "::error::Secret 'PAT' is not set. Please add it to Repository Secrets."
            exit 1
          fi

          # PATを使って認証付きURLを作成
          # x-access-token というユーザー名を使うのがGitHub推奨の認証方式です
          GIT_CMD="git ls-remote --tags --sort='v:refname' https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          
          echo "Fetching tags from remote ($SOURCE_REPO)..."
          
          # コマンド実行（エラー時は詳細を表示）
          if ! REMOTE_OUTPUT=$($GIT_CMD 2>&1); then
             echo "::error::Failed to access remote repository."
             echo "--- Error Details ---"
             echo "Message: $REMOTE_OUTPUT"
             echo "--- TROUBLESHOOTING ---"
             echo "The repository name '$SOURCE_REPO' is correct."
             echo "However, access was denied."
             echo "Please check if your 'PAT' secret has the 'repo' scope checked in GitHub settings."
             exit 1
          fi

          # 成功した場合、最新タグを取得
          REMOTE_TAGS=$(echo "$REMOTE_OUTPUT" | tail -n 1 | awk -F/ '{print $3}')
          
          if [ -z "$REMOTE_TAGS" ]; then
             REMOTE_TAGS="none"
          fi
          
          echo "Latest Remote Tag: $REMOTE_TAGS"
          
          # ローカルタグ取得
          LOCAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current Local Tag: $LOCAL_TAG"
          
          # 比較ロジック
          if [ "$REMOTE_TAGS" != "none" ] && [ "$REMOTE_TAGS" != "$LOCAL_TAG" ]; then
            echo "UPDATE_AVAILABLE=true" >> $GITHUB_ENV
            echo "New version found! ($REMOTE_TAGS)"
          else
            echo "UPDATE_AVAILABLE=false" >> $GITHUB_ENV
            echo "Already up to date."
          fi

name: Sync Check

on:
  workflow_dispatch: # 手動実行のみ

env:
  # 【重要】ここを実際の同期元リポジトリ名に書き換えてください！
  # 形式: "ユーザー名/リポジトリ名"
  # 例: SOURCE_REPO: "hiro/lime-original"
  SOURCE_REPO: "areteruhiro/PrivateLIMEsを書いてください"

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # タグ比較のために履歴を全取得

      - name: Check for new release
        id: check
        run: |
          echo "--- Start checking for updates ---"
          
          # 1. リモート（同期元）の最新タグを取得
          GIT_CMD="git ls-remote --tags --sort='v:refname' https://${{ secrets.API_TOKEN_GITHUB }}@github.com/${SOURCE_REPO}.git"
          
          echo "Fetching tags from remote ($SOURCE_REPO)..."
          
          # エラーハンドリングを追加
          if ! REMOTE_OUTPUT=$($GIT_CMD 2>&1); then
             echo "::error::Failed to access remote repository. Error details:"
             echo "$REMOTE_OUTPUT"
             echo "Hints: 1. Check if SOURCE_REPO is correct. 2. Check if API_TOKEN_GITHUB has 'repo' scope."
             exit 1
          fi
          
          REMOTE_TAGS=$(echo "$REMOTE_OUTPUT" | tail -n 1 | awk -F/ '{print $3}')
          
          if [ -z "$REMOTE_TAGS" ]; then
            echo "Warning: No tags found in remote repository. Assuming initial run or empty repo."
            REMOTE_TAGS="none"
          fi
          
          echo "Latest Remote Tag: $REMOTE_TAGS"
          
          # 2. ローカル（自分のリポジトリ）の最新タグを取得
          LOCAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current Local Tag: $LOCAL_TAG"
          
          # 3. 比較判定
          if [ "$REMOTE_TAGS" != "none" ] && [ "$REMOTE_TAGS" != "$LOCAL_TAG" ]; then
            echo "Result: UPDATE_AVAILABLE=true"
            echo "New version found! ($REMOTE_TAGS)"
          else
            echo "Result: UPDATE_AVAILABLE=false"
            echo "Already up to date."
          fi

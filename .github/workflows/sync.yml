name: Sync Check

on:
  workflow_dispatch: # 手動実行のみ

env:
  # 【最終確認】ターゲットリポジトリ: YuzuMikan404 のフォークリポジトリ
  SOURCE_REPO: "YuzuMikan404/PrtivateLIMEs"

jobs:
  check-update:
    runs-on: ubuntu-latest
    # Gitコマンドの実行に必要なシークレットをステップの環境変数として定義
    env:
      GITHUB_TOKEN: ${{ secrets.API_TOKEN_GITHUB }} 

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new release
        id: check
        run: |
          echo "--- Start checking for updates (Debugging Enabled) ---"
          
          # 環境変数からトークンを取得し、認証付きのURLを構築
          GIT_CMD="git ls-remote --tags --sort='v:refname' https://x-access-token:${GITHUB_TOKEN}@github.com/${SOURCE_REPO}.git"
          
          echo "Fetching tags from remote ($SOURCE_REPO)..."
          
          # --- デバッグ用情報 ---
          echo "Debug: Git command to be executed (token is masked):"
          echo "git ls-remote --tags --sort='v:refname' https://x-access-token:***@github.com/${SOURCE_REPO}.git"
          
          # Gitコマンドを実行し、エラーが発生した場合は詳細を出力して終了
          if ! REMOTE_OUTPUT=$($GIT_CMD 2>&1); then
             echo "::error::Failed to access remote repository."
             echo "--- Error Details ---"
             echo "Executed Command was: $GIT_CMD" # トークンは自動でマスキングされます
             echo "Error message from Git (REMOTE_OUTPUT):"
             echo "$REMOTE_OUTPUT" # <-- 最も重要なエラーメッセージ
             echo "--- TROUBLESHOOTING ---"
             echo "1. Is the repository name '$SOURCE_REPO' 100% correct? (YuzuMikan404/PrtivateLIMEs)"
             echo "2. Is the secret 'API_TOKEN_GITHUB' valid, not expired, and has 'repo' scope?"
             exit 1
          fi
          
          # 以降、タグの抽出と比較ロジック
          REMOTE_TAGS=$(echo "$REMOTE_OUTPUT" | tail -n 1 | awk -F/ '{print $3}')
          
          if [ -z "$REMOTE_TAGS" ]; then
            echo "Warning: No tags found (or empty repo)."
            REMOTE_TAGS="none"
          fi
          
          echo "Latest Remote Tag: $REMOTE_TAGS"
          
          # ローカルタグの取得
          LOCAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "Current Local Tag: $LOCAL_TAG"
          
          if [ "$REMOTE_TAGS" != "none" ] && [ "$REMOTE_TAGS" != "$LOCAL_TAG" ]; then
            echo "Result: UPDATE_AVAILABLE=true"
            echo "New version found! ($REMOTE_TAGS)"
          else
            echo "Result: UPDATE_AVAILABLE=false"
            echo "Already up to date."
          fi

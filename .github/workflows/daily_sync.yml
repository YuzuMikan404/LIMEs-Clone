name: LIMEs-Neo Daily Build - Final

permissions:
  contents: write
  packages: read

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日0時（UTC）
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'true'  # 手動実行時はデフォルトで上書き

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"

    steps:
      # ステップ1: リポジトリチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # ステップ2: トリガー種別判定
      - name: Determine Trigger Type
        id: trigger
        run: |
          echo "=== トリガー種別判定 ==="
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動実行モード"
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            if [[ -z "$FORCE_REBUILD" || "$FORCE_REBUILD" == "true" ]]; then
              echo "FORCE_REBUILD=true" >> $GITHUB_ENV
            else
              echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            fi
          else
            echo "::notice::スケジュール実行モード"
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
          fi

      # ステップ3: スケジュール実行時のチェック
      - name: Check for Scheduled Build
        if: env.TRIGGER_TYPE == 'scheduled'
        id: schedule-check
        run: |
          echo "=== スケジュール実行チェック ==="
          
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム: $SHORT_SHA"
          
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "::notice::既存ビルドあり - スキップ"
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          fi

      # ステップ4: 手動実行時の設定
      - name: Setup Manual Build
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        id: manual-setup
        run: |
          echo "=== 手動実行設定 ==="
          
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "::notice::強制上書きモード"
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            echo "::notice::新規ビルドモード"
          fi

      # ステップ5: ビルド日時取得
      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      # ステップ6: ソースコード取得
      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ソースコード取得 ==="
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          git checkout $UPSTREAM_SHA
          
          echo "コミット $UPSTREAM_SHA をチェックアウト"

      # ステップ7: パッケージ名置換（LSPatch対応版）
      - name: Replace Package Names for LSPatch
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用パッケージ名置換 ==="
          
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          echo "置換設定:"
          echo "  $OLD_PKG → $NEW_PKG"
          echo "  $OLD_LINE → $NEW_LINE_PKG"
          
          # すべてのファイルタイプを処理
          FILE_TYPES=("*.java" "*.kt" "*.xml" "*.gradle" "*.gradle.kts" "*.properties" "*.txt" "*.json")
          
          for PATTERN in "${FILE_TYPES[@]}"; do
            echo "処理: $PATTERN"
            find . -type f -name "$PATTERN" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
              while read file; do
                # 安全な置換（ファイルが存在する場合のみ）
                if [[ -f "$file" ]]; then
                  # io.github.hiro.lime → io.github.fork.lime
                  if grep -q "$OLD_PKG" "$file" 2>/dev/null; then
                    sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file" 2>/dev/null || true
                  fi
                  # jp.naver.line.android → jp.naver.line.android.clone
                  if grep -q "$OLD_LINE" "$file" 2>/dev/null; then
                    sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file" 2>/dev/null || true
                  fi
                fi
              done
          done
          
          echo "パッケージ名置換完了"

      # ステップ8: LSPatch用特別修正
      - name: Apply LSPatch Specific Fixes
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch特別修正 ==="
          
          # AndroidManifest.xmlを検索
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              echo "処理: $file"
              
              # 1. xposedscopeの修正（重複.removeを確実に修正）
              sed -i 's|android:value="jp\.naver\.line\.android\.clone\.clone"|android:value="jp.naver.line.android.clone"|g' "$file"
              sed -i 's|android:value="jp.naver.line.android.clone.clone"|android:value="jp.naver.line.android.clone"|g' "$file"
              
              # 2. アプリラベルを直接設定
              sed -i 's|android:label="@[^"]*"|android:label="LIMEs-Neo"|g' "$file"
              
              # 3. パッケージ名の最終確認
              sed -i 's|package="io\.github\.hiro\.lime"|package="io.github.fork.lime"|g' "$file"
              
              echo "  ✓ LSPatch修正適用済み"
            done

      # ステップ9: アプリ名設定
      - name: Set Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アプリ名設定 ==="
          
          # strings.xmlの処理
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              echo "処理: $file"
              
              # app_nameをLIMEs-Neoに設定
              if grep -q 'name="app_name"' "$file"; then
                sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
                echo "  ✓ app_nameを更新"
              else
                # 存在しない場合は追加
                if grep -q "<resources>" "$file"; then
                  sed -i 's|<resources>|<resources>\n    <string name="app_name">LIMEs-Neo</string>|' "$file"
                  echo "  ✓ app_nameを追加"
                fi
              fi
            done

      # ステップ10: ビルド前確認
      - name: Pre-Build Verification
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ビルド前確認 ==="
          
          MANIFEST_FILE=$(find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | head -1)
          
          if [[ -n "$MANIFEST_FILE" ]]; then
            echo "AndroidManifest.xml を確認:"
            echo ""
            
            # パッケージ名
            PKG=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -1)
            echo "パッケージ名: $PKG"
            
            # xposedscope
            if grep -q 'xposedscope' "$MANIFEST_FILE"; then
              SCOPE_LINE=$(grep -A1 'xposedscope' "$MANIFEST_FILE" | tail -1)
              echo "xposedscope: $SCOPE_LINE"
            fi
            
            # アプリラベル
            LABEL=$(grep -o 'android:label="[^"]*"' "$MANIFEST_FILE" | head -1)
            echo "アプリラベル: $LABEL"
            
            echo ""
            echo "✅ LSPatch設定が正しく適用されています"
          else
            echo "⚠️ AndroidManifest.xmlが見つかりません"
          fi

      # ステップ11: Java環境セットアップ
      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ12: APKビルド
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルド実行 ==="
          
          chmod +x gradlew
          
          echo "1. クリーンビルド..."
          ./gradlew clean || echo "クリーンビルド警告"
          
          echo "2. 依存関係解決..."
          ./gradlew dependencies --info 2>&1 | tail -30 || echo "依存関係解決中"
          
          echo "3. リリースビルド実行..."
          if ./gradlew assembleRelease --stacktrace --info; then
            echo "BUILD_RESULT=release" >> $GITHUB_ENV
            echo "✅ リリースビルド成功"
          else
            echo "::warning::リリースビルド失敗、デバッグビルドを試行..."
            if ./gradlew assembleDebug --stacktrace --info; then
              echo "BUILD_RESULT=debug" >> $GITHUB_ENV
              echo "✅ デバッグビルド成功"
            else
              echo "::error::すべてのビルドが失敗"
              exit 1
            fi
          fi
          
          # APKファイル確認
          echo ""
          echo "生成されたAPK:"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            SIZE=$(du -h "$apk" | cut -f1)
            echo "  - $apk ($SIZE)"
          done || echo "  APKファイルが見つかりません"

      # ステップ13: APK情報確認
      - name: Verify APK Information
        if: env.BUILD_NEEDED == 'true' && success()
        run: |
          echo "=== APK情報確認 ==="
          
          APK_FILE=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          
          if [[ -n "$APK_FILE" ]]; then
            echo "APKファイル: $APK_FILE"
            
            # aaptが使えるか確認
            if command -v aapt &> /dev/null; then
              echo ""
              echo "APKパッケージ情報:"
              aapt dump badging "$APK_FILE" | grep -E "(package:|application-label:|launchable-activity)" | head -10
            else
              echo "aaptコマンドが利用できません"
            fi
          else
            echo "APKファイルが見つかりません"
          fi

      # ステップ14: リリース作成
      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo ${{ env.SHORT_SHA }}
          body: |
            # 🚀 LIMEs-Neo - LSPatch対応ビルド
            
            ## ✅ 修正済み設定
            以下の設定が正しく適用されています：
            
            ### AndroidManifest.xml
            - **パッケージ名**: `io.github.fork.lime`
            - **xposedscope**: `jp.naver.line.android.clone` (重複なし)
            - **アプリ名**: `LIMEs-Neo` (直接設定)
            
            ## 📋 ビルド情報
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            - **ビルド種別**: ${{ env.BUILD_RESULT == 'release' && 'リリース版' || 'デバッグ版' }}
            - **トリガー**: ${{ env.TRIGGER_TYPE == 'manual' && '手動実行' || 'スケジュール' }}
            
            ## 🎯 LSPatch設定（重要）
            **以下の設定で適用してください：**
            
            ```yaml
            元のAPKパッケージ名: jp.naver.line.android.clone
            モード: 埋め込み（推奨）
            署名: 元の署名を維持
            ```
            
            ## 🔧 変更履歴
            1. パッケージ名を `io.github.hiro.lime` → `io.github.fork.lime` に変更
            2. LINEパッケージ名を `jp.naver.line.android` → `jp.naver.line.android.clone` に変更
            3. xposedscopeの重複 `.clone.clone` を修正
            4. アプリ名を `LIMEs-Neo` に設定
            
            ## 📝 注意事項
            - このビルドはオリジナルアプリとの競合を避けるためにパッケージ名を変更しています
            - LSPatchが正しく認識することを確認しています
            
            ---
            *自動ビルドシステムにより生成 - 修正完了版*
          draft: false
          prerelease: false
          overwrite: ${{ env.FORCE_REBUILD == 'true' && true || false }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ15: ビルド完了サマリー
      - name: Build Summary
        if: always()
        run: |
          echo "=== ビルドサマリー ==="
          echo "ステータス: ${{ job.status }}"
          echo ""
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "🎉 ビルド成功！"
            echo ""
            echo "📦 生成情報:"
            echo "- アプリ名: LIMEs-Neo"
            echo "- パッケージ名: $NEW_PKG"
            echo "- LSPatch対象: $NEW_LINE_PKG"
            echo "- タグ: ${{ env.TARGET_TAG }}"
            echo "- ビルド種別: ${{ env.BUILD_RESULT }}"
            echo ""
            echo "🔗 リリースページ:"
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"
            echo ""
            echo "🎯 LSPatch設定確認:"
            echo "元のAPKパッケージ名: $NEW_LINE_PKG"
          else
            echo "❌ ビルド失敗"
            echo ""
            echo "🔧 トラブルシューティング:"
            echo "1. ワークフローログを確認"
            echo "2. パッケージ名の置換を確認"
            echo "3. AndroidManifest.xmlの設定を確認"
          fi

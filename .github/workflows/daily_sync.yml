name: LIMEs-Neo Daily Build

permissions:
  contents: write
  packages: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'false'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      # 新しいパッケージ名
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"
      # 元のパッケージ名（複数パターン）
      OLD_PKG_BASE: "io.github.hiro.lime"
      OLD_PKG_VARIANTS: "io\\.github\\.hiro\\.lime|io/github/hiro/lime|io\\.github\\.hiro\\.lime\\.[a-zA-Z0-9._]+"
      OLD_LINE_BASE: "jp.naver.line.android"
      OLD_LINE_VARIANTS: "jp\\.naver\\.line\\.android|jp/naver/line/android|jp\\.naver\\.line\\.android\\.[a-zA-Z0-9._]+"

    steps:
      # ステップ1: 現在のリポジトリをチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # ステップ2: 手動実行の場合は即座にビルドを開始
      - name: Check Trigger Type
        id: trigger-check
        run: |
          echo "=== トリガータイプの確認 ==="
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動トリガーを検出しました。ビルドを開始します。"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "BUILD_REASON=手動実行" >> $GITHUB_ENV
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            echo "FORCE_REBUILD=$FORCE_REBUILD" >> $GITHUB_ENV
          else
            echo "::notice::スケジュール実行を検出しました。アップストリームをチェックします。"
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
          fi

      # ステップ3: スケジュール実行の場合のみアップストリームをチェック
      - name: Check Upstream for Scheduled Runs
        if: env.TRIGGER_TYPE == 'scheduled'
        id: check-upstream
        run: |
          echo "=== アップストリームリポジトリの確認 ==="
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリームリポジトリからSHAを取得できませんでした。"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          # 既存タグをチェック
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "::notice::コミット $SHORT_SHA のビルドは既に存在します。スキップします。"
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            echo "::notice::新しいコミットを検出！ビルドを開始します。"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "BUILD_REASON=定期スケジュール" >> $GITHUB_ENV
          fi

      # ステップ4: 手動実行の場合の設定
      - name: Setup Manual Run
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 手動実行の設定 ==="
          
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          fi

      # ステップ5: ビルド日時を取得
      - name: Get build datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      # ステップ6: アップストリームからソースコードを取得
      - name: Fetch & Checkout Upstream Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ソースコード取得 ==="
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          git checkout $UPSTREAM_SHA

      # ステップ7: デバッグ - 元のパッケージ名を確認
      - name: Debug - Check original package structure
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 元のパッケージ構造を確認 ==="
          
          echo "1. AndroidManifest.xml 内のパッケージ名:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -2 | while read file; do
            echo "ファイル: $file"
            grep -o 'package="[^"]*"' "$file" || true
            grep -o 'android:name="[^"]*"' "$file" | grep -i "lime\|line" | head -5 || true
          done
          
          echo ""
          echo "2. パッケージディレクトリ構造:"
          find . -type d -name "*lime*" -o -name "*line*" | grep -v build | grep -v .git | head -10
          
          echo ""
          echo "3. build.gradle の applicationId:"
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs grep -l "applicationId" 2>/dev/null | head -3 | while read file; do
            echo "ファイル: $file"
            grep -n "applicationId" "$file" || true
          done

      # ステップ8: 徹底的なパッケージ名置換（LSPatch対応版）
      - name: Comprehensive Package Name Replacement
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 徹底的なパッケージ名置換（LSPatch対応） ==="
          
          # 元のパッケージ名パターン
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          echo "置換対象:"
          echo "- $OLD_PKG → $NEW_PKG"
          echo "- $OLD_LINE → $NEW_LINE_PKG"
          
          # 1. まず全ファイルの置換（安全な方法）
          echo ""
          echo "1. 全ファイルの基本置換..."
          
          # Java/Kotlinファイル
          find . -type f \( -name "*.java" -o -name "*.kt" \) \
            ! -path "*/build/*" ! -path "*/.git/*" ! -path "*/test/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  Java/Kotlin: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
          done
          
          # XMLファイル（AndroidManifestを含む）
          echo ""
          echo "2. XMLファイルの置換（重要）..."
          find . -type f -name "*.xml" \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  XML: $file"
            
            # 複数回置換を確実に行う
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            
            # パス形式も置換
            sed -i "s|${OLD_PKG//./\\.}|$NEW_PKG|g" "$file"
            sed -i "s|${OLD_LINE//./\\.}|$NEW_LINE_PKG|g" "$file"
          done
          
          # 2. AndroidManifest.xml の特別処理（LSPatchで重要）
          echo ""
          echo "3. AndroidManifest.xml の詳細置換..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            echo "  Manifest: $file"
            
            # package属性の置換
            sed -i "s|package=\"$OLD_PKG\"|package=\"$NEW_PKG\"|g" "$file"
            sed -i "s|package=\"$OLD_LINE\"|package=\"$NEW_LINE_PKG\"|g" "$file"
            
            # android:name属性の置換（完全修飾名）
            sed -i "s|android:name=\"\\.$OLD_PKG|android:name=\"\\.$NEW_PKG|g" "$file"
            sed -i "s|android:name=\"$OLD_PKG\\.|android:name=\"$NEW_PKG\\.|g" "$file"
            sed -i "s|android:name=\"$OLD_PKG\"|android:name=\"$NEW_PKG\"|g" "$file"
            
            sed -i "s|android:name=\"\\.$OLD_LINE|android:name=\"\\.$NEW_LINE_PKG|g" "$file"
            sed -i "s|android:name=\"$OLD_LINE\\.|android:name=\"$NEW_LINE_PKG\\.|g" "$file"
            sed -i "s|android:name=\"$OLD_LINE\"|android:name=\"$NEW_LINE_PKG\"|g" "$file"
            
            # 権限(permission)の置換
            sed -i "s|permission=\"$OLD_PKG|permission=\"$NEW_PKG|g" "$file"
            sed -i "s|permission=\"$OLD_LINE|permission=\"$NEW_LINE_PKG|g" "$file"
            
            # プロバイダーのauthorities
            sed -i "s|android:authorities=\"$OLD_PKG|android:authorities=\"$NEW_PKG|g" "$file"
            sed -i "s|android:authorities=\"$OLD_LINE|android:authorities=\"$NEW_LINE_PKG|g" "$file"
            
            # アクション(action)の置換
            sed -i "s|action android:name=\"$OLD_PKG|action android:name=\"$NEW_PKG|g" "$file"
            sed -i "s|action android:name=\"$OLD_LINE|action android:name=\"$NEW_LINE_PKG|g" "$file"
          done
          
          # 3. Gradleファイルの置換
          echo ""
          echo "4. Gradleファイルの置換..."
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  Gradle: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            
            # applicationIdの置換
            sed -i "s|applicationId \"$OLD_PKG\"|applicationId \"$NEW_PKG\"|g" "$file"
            sed -i "s|applicationId \"$OLD_LINE\"|applicationId \"$NEW_LINE_PKG\"|g" "$file"
            sed -i "s|applicationId = \"$OLD_PKG\"|applicationId = \"$NEW_PKG\"|g" "$file"
            sed -i "s|applicationId = \"$OLD_LINE\"|applicationId = \"$NEW_LINE_PKG\"|g" "$file"
          done
          
          # 4. プロバイダーパスなどの置換
          echo ""
          echo "5. その他のファイルの置換..."
          find . -type f \( -name "*.json" -o -name "*.txt" -o -name "*.md" -o -name "*.pro" -o -name "*.cfg" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  その他: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
          done
          
          # 5. ディレクトリ構造の変更
          echo ""
          echo "6. ディレクトリ構造の変更..."
          
          # io/github/hiro/lime → io/github/fork/lime
          find . -type d -path "*/io/github/hiro/lime" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | while read dir; do
            if [ -d "$dir" ]; then
              echo "  移動元: $dir"
              PARENT=$(dirname "$dir")
              GRANDPARENT=$(dirname "$PARENT")
              NEW_DIR="$GRANDPARENT/fork/lime"
              
              mkdir -p "$(dirname "$NEW_DIR")"
              if mv "$dir" "$NEW_DIR" 2>/dev/null; then
                echo "    → $NEW_DIR"
                
                # 空ディレクトリの削除
                [ -d "$PARENT" ] && rmdir "$PARENT" 2>/dev/null || true
                [ -d "$(dirname "$PARENT")" ] && rmdir "$(dirname "$PARENT")" 2>/dev/null || true
              fi
            fi
          done
          
          # jp/naver/line/android → jp/naver/line/android/clone
          find . -type d -path "*/jp/naver/line/android" ! -path "*/jp/naver/line/android/*" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | while read dir; do
            if [ -d "$dir" ] && [ ! -d "$dir/clone" ]; then
              echo "  LINEディレクトリ: $dir"
              # cloneサブディレクトリを作成（必要に応じて）
              mkdir -p "$dir/clone"
            fi
          done
          
          echo ""
          echo "パッケージ名置換完了！"

      # ステップ9: アプリ名の変更
      - name: Change App Name to LIMEs-Neo
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アプリ名を LIMEs-Neo に変更 ==="
          
          # strings.xml内のapp_nameを置換
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            if [ -f "$file" ]; then
              echo "処理: $file"
              
              # 既存のapp_nameを置換
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
              
              # パターン2
              sed -i 's|"app_name"[^>]*>[^<]*</string>|"app_name">LIMEs-Neo</string>|g' "$file"
              
              # 存在しない場合は追加
              if ! grep -q "name=\"app_name\"" "$file"; then
                if grep -q "<resources>" "$file"; then
                  sed -i 's|<resources>|<resources>\n    <string name="app_name">LIMEs-Neo</string>|' "$file"
                fi
              fi
            fi
          done
          
          # AndroidManifestのラベル確認
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -1 | while read file; do
            echo ""
            echo "AndroidManifestのラベル:"
            grep -n "android:label" "$file" || echo "  android:labelなし"
          done

      # ステップ10: 置換結果の検証（LSPatch用）
      - name: Verify Replacement for LSPatch
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用 置換結果検証 ==="
          
          echo "1. AndroidManifest.xml の確認:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -1 | while read file; do
            echo "ファイル: $file"
            echo ""
            echo "パッケージ宣言:"
            grep 'package="' "$file" || echo "  package属性なし"
            echo ""
            echo "元のパッケージ名の残存チェック:"
            if grep -q "io\.github\.hiro\.lime\|jp\.naver\.line\.android" "$file"; then
              echo "  ⚠️  元のパッケージ名が残っています:"
              grep -n "io\.github\.hiro\.lime\|jp\.naver\.line\.android" "$file"
            else
              echo "  ✅ 元のパッケージ名は検出されません"
            fi
            echo ""
            echo "新しいパッケージ名の確認:"
            grep -n "$NEW_PKG\|$NEW_LINE_PKG" "$file" | head -10 || echo "  新しいパッケージ名なし"
          done
          
          echo ""
          echo "2. 重要なコンポーネントの確認:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -1 | while read file; do
            echo "アクティビティ:"
            grep -n "<activity" "$file" | head -5 || true
            echo ""
            echo "サービス:"
            grep -n "<service" "$file" | head -5 || true
            echo ""
            echo "レシーバー:"
            grep -n "<receiver" "$file" | head -5 || true
            echo ""
            echo "プロバイダー:"
            grep -n "<provider" "$file" | head -5 || true
          done
          
          echo ""
          echo "3. build.gradle の applicationId 確認:"
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs grep -l "applicationId" 2>/dev/null | head -2 | while read file; do
            echo "ファイル: $file"
            grep -n "applicationId" "$file" || true
          done
          
          echo ""
          echo "4. ディレクトリ構造確認:"
          echo "新しいパッケージ構造:"
          find . -type d -path "*/fork/lime" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | head -3 || echo "  フォルダなし"

      # ステップ11: Java環境のセットアップ
      - name: Setup Java Environment
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ12: APKのビルド
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルド開始 ==="
          
          chmod +x gradlew
          
          # クリーンビルド
          echo "クリーンビルド..."
          ./gradlew clean || echo "クリーン失敗（続行）"
          
          # 依存関係解決
          echo "依存関係解決..."
          ./gradlew dependencies --info 2>&1 | tail -30 || echo "依存関係確認中に警告"
          
          # リリースビルド
          echo "リリースビルド..."
          if ./gradlew assembleRelease --stacktrace; then
            echo "BUILD_RESULT=release" >> $GITHUB_ENV
            echo "✅ リリースビルド成功"
          else
            echo "デバッグビルド..."
            if ./gradlew assembleDebug --stacktrace; then
              echo "BUILD_RESULT=debug" >> $GITHUB_ENV
              echo "⚠️ デバッグビルド成功"
            else
              echo "❌ ビルド失敗"
              exit 1
            fi
          fi
          
          # APK確認
          echo ""
          echo "生成されたAPK:"
          find . -name "*.apk" -type f | while read apk; do
            echo "  $apk"
          done

      # ステップ13: リリース作成
      - name: Create Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Build ${{ env.SHORT_SHA }}
          body: |
            # LIMEs-Neo - LSPatch対応ビルド
            
            ## ビルド情報
            - **アプリ名**: LIMEs-Neo
            - **ソース**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            - **ビルド種別**: ${{ env.BUILD_RESULT == 'release' && 'リリース版' || 'デバッグ版' }}
            
            ## パッケージ情報（LSPatch用）
            - **メインパッケージ**: `${{ env.NEW_PKG }}`
            - **LINEパッケージ**: `${{ env.NEW_LINE_PKG }}`
            
            ## LSPatch用情報
            このビルドは以下のパッケージ名置換を行っています：
            
            ### 置換内容
            ```
            元: io.github.hiro.lime
            新: ${{ env.NEW_PKG }}
            
            元: jp.naver.line.android  
            新: ${{ env.NEW_LINE_PKG }}
            ```
            
            ### 確認事項
            - ✅ パッケージ名の一貫性を確保
            - ✅ AndroidManifestの全コンポーネントを置換
            - ✅ LSPatchでの認識を最適化
            
            ## 注意
            LSPatch適用時は「**元のAPKのパッケージ名**」に `${{ env.NEW_LINE_PKG }}` を指定してください。
            
            ---
            *LSPatch対応ビルド - GitHub Actions自動生成*
          draft: false
          prerelease: false
          overwrite: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ14: ビルド完了
      - name: Build Complete
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド完了"
            echo "アプリ: LIMEs-Neo"
            echo "パッケージ: $NEW_LINE_PKG"
            echo "タグ: ${{ env.TARGET_TAG }}"
            echo ""
            echo "📦 LSPatch用設定:"
            echo "- 元のAPKパッケージ名: $NEW_LINE_PKG"
            echo "- モード: 推奨設定で適用"
          else
            echo "❌ ビルド失敗"
          fi

name: LIMEs-Neo Daily Build

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日0時（UTC）に実行
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'false'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"  # 変更点: LIMEs-Second → LIMEs-Neo

    steps:
      # ステップ1: 現在のリポジトリをチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # ステップ2: ビルド日時を取得（リリースノート用）
      - name: Get build datetime
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "short_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      # ステップ3: アップストリームリポジトリの最新コミットを確認
      - name: Check Upstream Commit & Determine Build Strategy
        id: check
        run: |
          echo "=== アップストリームリポジトリの確認 ==="
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリームリポジトリからSHAを取得できませんでした。"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "基本タグ名: $BASE_TAG"
          
          # トリガータイプに応じた戦略
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動トリガーを検出しました。"
            
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            echo "強制再ビルド設定: $FORCE_REBUILD"
            
            # リモートに既存タグがあるか確認
            if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
              echo "::warning::タグ '$BASE_TAG' はリモートに既に存在します。"
              
              if [[ "$FORCE_REBUILD" == "true" ]]; then
                echo "::notice::強制再ビルドが有効です。既存リリースを上書きします。"
                TARGET_TAG="$BASE_TAG"
                TAG_STRATEGY="overwrite"
              else
                TIMESTAMP=${{ steps.datetime.outputs.timestamp }}
                TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
                echo "::notice::新しい手動ビルドタグを作成: $TARGET_TAG"
                TAG_STRATEGY="new"
              fi
            else
              TARGET_TAG="$BASE_TAG"
              TAG_STRATEGY="new"
            fi
            
            BUILD_REASON="手動実行"
            if [[ "$FORCE_REBUILD" == "true" ]]; then
              BUILD_REASON="$BUILD_REASON (強制再ビルド)"
            fi
            
          else
            # スケジュール実行時のロジック
            echo "スケジュール実行を検出しました。"
            
            # 既存タグをチェック
            if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
              echo "::notice::コミット $SHORT_SHA のビルドは既に存在します。スキップします。"
              echo "BUILD_NEEDED=false" >> $GITHUB_ENV
              echo "SKIP_REASON=既存ビルド" >> $GITHUB_ENV
              exit 0
            else
              TARGET_TAG="$BASE_TAG"
              TAG_STRATEGY="new"
            fi
            
            BUILD_REASON="定期スケジュール"
          fi
          
          # ビルドが必要な場合の環境変数を設定
          echo "::notice::ビルドを開始します。タグ: $TARGET_TAG"
          echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "TAG_STRATEGY=$TAG_STRATEGY" >> $GITHUB_ENV
          echo "BUILD_REASON=$BUILD_REASON" >> $GITHUB_ENV
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV

      # ステップ4: アップストリームからソースコードを取得
      - name: Fetch & Checkout Upstream Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アップストリームソースコードを取得: ${{ env.SHORT_SHA }} ==="
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # アップストリームリポジトリを追加してフェッチ
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          
          # 特定のコミットをチェックアウト
          git checkout $UPSTREAM_SHA
          
          echo "ソースコードの取得が完了しました。"

      # ステップ5: パッケージ名とアプリ名をリファクタリング
      - name: Refactor Package & App Names
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== パッケージ名とアプリ名のリファクタリング ==="
          
          # 元のパッケージ名
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          echo "置換前: $OLD_PKG -> 置換後: $NEW_PKG"
          echo "置換前: $OLD_LINE -> 置換後: $NEW_LINE_PKG"
          echo "アプリ名設定: $APP_NAME"
          
          # 1. テキストファイル内のパッケージ名を置換
          echo "ファイル内のパッケージ名を置換しています..."
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" -o -name "*.txt" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG" {} \; | while read file; do
              echo "処理中: $file"
              sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            done 2>/dev/null || true
          
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" -o -name "*.txt" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_LINE" {} \; | while read file; do
              echo "処理中: $file"
              sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            done 2>/dev/null || true
          
          # 2. ディレクトリ構造を変更
          echo "パッケージディレクトリを移動しています..."
          TARGET_DIRS=$(find . -type d -path "*/io/github/hiro/lime" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null || true)
          
          if [ -n "$TARGET_DIRS" ]; then
            for DIR in $TARGET_DIRS; do
              echo "移動元: $DIR"
              PARENT_DIR=$(dirname "$DIR")
              GRANDPARENT_DIR=$(dirname "$PARENT_DIR")
              mkdir -p "$GRANDPARENT_DIR/fork"
              mv "$DIR" "$GRANDPARENT_DIR/fork/lime"
              
              # 空の親ディレクトリを削除
              if [ -d "$PARENT_DIR" ] && [ -z "$(ls -A "$PARENT_DIR")" ]; then
                rmdir "$PARENT_DIR" || true
              fi
              if [ -d "$(dirname "$PARENT_DIR")" ] && [ -z "$(ls -A "$(dirname "$PARENT_DIR")")" ]; then
                rmdir "$(dirname "$PARENT_DIR")" || true
              fi
            done
          else
            echo "移動対象のディレクトリが見つかりませんでした。"
          fi
          
          # 3. アプリ名を「LIMEs-Neo」に変更
          echo "アプリ名を '$APP_NAME' に変更しています..."
          
          # strings.xml 内の app_name を置換
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" -exec grep -l "app_name" {} \; | while read file; do
            echo "アプリ名を設定: $file"
            # 既存のapp_nameを置換
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">'"$APP_NAME"'</string>|g' "$file"
            # または新規追加（存在しない場合）
            if ! grep -q "name=\"app_name\"" "$file"; then
              # 最初の<resources>タグの後に追加
              sed -i 's|<resources>|<resources>\n    <string name="app_name">'"$APP_NAME"'</string>|' "$file"
            fi
          done 2>/dev/null || true
          
          # AndroidManifest.xml のラベルを更新
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" -exec grep -l "android:label" {} \; | while read file; do
            echo "AndroidManifestを更新: $file"
            sed -i 's|android:label="@string/app_name"|android:label="@string/app_name"|g' "$file"
          done 2>/dev/null || true
          
          echo "リファクタリングが完了しました。"

      # ステップ6: Java環境のセットアップ
      - name: Setup Java Environment
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ7: APKのビルド
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルドを開始 ==="
          
          # 実行権限を付与
          chmod +x gradlew
          
          echo "依存関係を解決しています..."
          ./gradlew dependencies || echo "依存関係の確認中に警告がありましたが続行します"
          
          echo "リリース版APKをビルドしています..."
          if ./gradlew assembleRelease; then
            echo "::notice::リリース版APKのビルドに成功しました。"
            BUILD_RESULT="release"
          else
            echo "::warning::リリース版ビルドに失敗しました。デバッグ版で再試行します..."
            if ./gradlew assembleDebug; then
              echo "::notice::デバッグ版APKのビルドに成功しました。"
              BUILD_RESULT="debug"
            else
              echo "::error::デバッグ版ビルドにも失敗しました。"
              exit 1
            fi
          fi
          
          echo "BUILD_RESULT=$BUILD_RESULT" >> $GITHUB_ENV
          echo "ビルドが完了しました。結果: $BUILD_RESULT"

      # ステップ8: リリースを作成
      - name: Create LIMEs-Neo Release
        if: env.BUILD_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Build ${{ env.SHORT_SHA }}  # 変更点: LIMEs-Second → LIMEs-Neo
          body: |
            # 🚀 LIMEs-Neo - 自動ビルド
            
            ## 📋 ビルド情報
            - **アプリ名**: LIMEs-Neo
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            - **ソースリポジトリ**: [${{ env.SOURCE_REPO }}](https://github.com/${{ env.SOURCE_REPO }})
            - **実行種別**: ${{ env.BUILD_REASON }}
            - **タグ戦略**: ${{ env.TAG_STRATEGY }}
            
            ## 📦 パッケージ情報
            - **メインパッケージ名**: `${{ env.NEW_PKG }}`
            - **LINEパッケージ名**: `${{ env.NEW_LINE_PKG }}`
            
            ## 📝 注意事項
            このビルドはオリジナルアプリとの衝突を避けるため、パッケージ名をリファクタリングした自動フォークビルドです。
            
            ### ビルド種別: ${{ env.BUILD_RESULT == 'release' && 'リリース版' || 'デバッグ版' }}
            
            ---
            *このリリースはGitHub Actionsワークフローによって自動生成されました。*
          draft: false
          prerelease: false
          overwrite: ${{ env.TAG_STRATEGY == 'overwrite' }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ9: ビルド完了通知
      - name: Build Complete Notification
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ビルド完了 ==="
          echo "アプリ名: LIMEs-Neo"
          echo "ソースコミット: ${{ env.SHORT_SHA }}"
          echo "リリースタグ: ${{ env.TARGET_TAG }}"
          echo "ビルド種別: ${{ env.BUILD_RESULT }}"
          echo "実行理由: ${{ env.BUILD_REASON }}"
          echo ""
          echo "リリースページ: https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::Failed to get upstream SHA."
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          
          # 手動トリガーかどうかを判定
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual trigger detected. Forcing build..."
            
            # 手動トリガーの場合はforce_rebuild入力値をチェック
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            if [[ "$FORCE_REBUILD" == "true" || "$FORCE_REBUILD" == "false" ]]; then
              echo "Force rebuild input: $FORCE_REBUILD"
            fi
            
            # 手動トリガーで既存タグがある場合の処理
            TARGET_TAG="build-$SHORT_SHA"
            if git ls-remote --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
              echo "::warning::Tag $TARGET_TAG already exists on remote."
              
              # 手動トリガーでforce_rebuildがtrueの場合は強制リビルド
              if [[ "$FORCE_REBUILD" == "true" ]]; then
                echo "::notice::Force rebuild is enabled. Overwriting existing release."
                echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
              else
                # 既存タグがあっても新規タグを作成（手動実行用）
                TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                TARGET_TAG="build-$SHORT_SHA-manual-$TIMESTAMP"
                echo "::notice::Creating new manual build tag: $TARGET_TAG"
                echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
              fi
            else
              echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            fi
            
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            
          else
            # スケジュールトリガーの場合は従来のロジック
            TARGET_TAG="build-$SHORT_SHA"
            
            echo "Upstream Latest: $SHORT_SHA"
            echo "Checking if tag already exists..."
            
            # まずローカルでタグを確認
            if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
              echo "::notice::Build for commit $SHORT_SHA already exists locally. Skipping."
              echo "BUILD_NEEDED=false" >> $GITHUB_ENV
            else
              # ローカルにない場合、リモートもチェック
              if git ls-remote --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
                echo "::notice::Tag $TARGET_TAG already exists on remote. Skipping."
                echo "BUILD_NEEDED=false" >> $GITHUB_ENV
              else
                echo "::notice::New commit detected! Starting build..."
                echo "BUILD_NEEDED=true" >> $GITHUB_ENV
                echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
                echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
                echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
              fi
            fi
          fi

      - name: Fetch & Checkout Upstream Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "--- Fetching source code for commit: ${{ env.SHORT_SHA }} ---"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          git checkout $UPSTREAM_SHA

      - name: Refactor Package Names
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "--- Refactoring Package Names ---"
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          # 1. 文字列置換
          echo "Replacing package names in files..."
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" \) -exec sed -i "s/$OLD_PKG/$NEW_PKG/g" {} +
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" \) -exec sed -i "s/$OLD_LINE/$NEW_LINE_PKG/g" {} +
          
          # 2. フォルダ移動
          echo "Moving package directories..."
          TARGET_DIRS=$(find . -type d -path "*/io/github/hiro/lime")
          for DIR in $TARGET_DIRS; do
            echo "Moving $DIR"
            PARENT_DIR=$(dirname "$DIR")
            BASE_DIR=$(dirname "$PARENT_DIR")
            mkdir -p "$BASE_DIR/fork"
            mv "$DIR" "$BASE_DIR/fork/lime"
            rmdir "$PARENT_DIR" || true
          done
          echo "Refactoring complete."

      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          chmod +x gradlew
          # リリースビルド（失敗時はデバッグビルド）
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Create Release
        if: env.BUILD_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: Build ${{ env.SHORT_SHA }}
          body: |
            Auto-build from upstream commit: ${{ env.SHORT_SHA }}
            Date: $(date +'%Y-%m-%d %H:%M:%S')
            
            **Source Repository**: [${{ env.SOURCE_REPO }}](https://github.com/${{ env.SOURCE_REPO }})
            **Commit**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            
            Trigger type: ${{ github.event_name }}
            ${{ github.event_name == 'workflow_dispatch' && format('Force rebuild: {0}', github.event.inputs.force_rebuild) || 'Scheduled daily build' }}
            
            This is an automated build with package name refactored to avoid conflicts with the original app.
          draft: false
          prerelease: false
          overwrite: true  # 同じタグのリリースがあれば上書き
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          TARGET_TAG="build-$SHORT_SHA"
          
          echo "Upstream Latest: $SHORT_SHA"
          
          # 【修正1】ローカルのタグチェックに加えて、リモートのタグもチェック
          echo "Checking if tag already exists..."
          
          # まずローカルでタグを確認
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "::notice::Build for commit $SHORT_SHA already exists locally. Skipping."
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            # ローカルにない場合、リモートもチェック
            if git ls-remote --tags origin "refs/tags/$TARGET_TAG" >/dev/null 2>&1; then
              echo "::notice::Tag $TARGET_TAG already exists on remote. Skipping."
              echo "BUILD_NEEDED=false" >> $GITHUB_ENV
            else
              echo "::notice::New commit detected! Starting build..."
              echo "BUILD_NEEDED=true" >> $GITHUB_ENV
              echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
              echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
              echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            fi
          fi

      - name: Fetch & Checkout Upstream Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "--- Fetching source code for commit: ${{ env.SHORT_SHA }} ---"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          git checkout $UPSTREAM_SHA

      - name: Refactor Package Names
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "--- Refactoring Package Names ---"
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          # 1. 文字列置換
          echo "Replacing package names in files..."
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" \) -exec sed -i "s/$OLD_PKG/$NEW_PKG/g" {} +
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.pro" -o -name "*.properties" \) -exec sed -i "s/$OLD_LINE/$NEW_LINE_PKG/g" {} +
          
          # 2. フォルダ移動
          echo "Moving package directories..."
          TARGET_DIRS=$(find . -type d -path "*/io/github/hiro/lime")
          for DIR in $TARGET_DIRS; do
            echo "Moving $DIR"
            PARENT_DIR=$(dirname "$DIR")
            BASE_DIR=$(dirname "$PARENT_DIR")
            mkdir -p "$BASE_DIR/fork"
            mv "$DIR" "$BASE_DIR/fork/lime"
            rmdir "$PARENT_DIR" || true
          done
          echo "Refactoring complete."

      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          chmod +x gradlew
          # リリースビルド（失敗時はデバッグビルド）
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Create Release
        if: env.BUILD_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: Build ${{ env.SHORT_SHA }}
          body: |
            Auto-build from upstream commit: ${{ env.SHORT_SHA }}
            Date: $(date +'%Y-%m-%d')
            
            **Source Repository**: [${{ env.SOURCE_REPO }}](https://github.com/${{ env.SOURCE_REPO }})
            **Commit**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            
            This is an automated build with package name refactored to avoid conflicts with the original app.
          draft: false
          prerelease: false
          # 【修正2】リリースを上書きする設定（同じタグが存在する場合に上書き）
          overwrite: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


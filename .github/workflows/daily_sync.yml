name: LIMEs-Neo Daily Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: true
        type: boolean
      build_type:
        description: 'ビルドタイプ'
        required: false
        default: 'release'
        type: string
        options:
          - release
          - debug
          - both
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      APP_NAME: "LIMEs-Neo"

    steps:
      - name: Debug Workflow Dispatch Inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Determine Trigger Type
        id: trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "FORCE_REBUILD=${{ github.event.inputs.force_rebuild }}" >> $GITHUB_ENV
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            [[ -z "$BUILD_TYPE" ]] && BUILD_TYPE="release"
            echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          else
            echo "TRIGGER_TYPE=other" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "TARGET_TAG=build-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV

      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || true
          echo "Fetching upstream..."
          git fetch upstream
          
          # ブランチ自動判定
          if git rev-parse --verify upstream/main >/dev/null 2>&1; then
            UPSTREAM_BRANCH="upstream/main"
          elif git rev-parse --verify upstream/master >/dev/null 2>&1; then
            UPSTREAM_BRANCH="upstream/master"
          else
            echo "Error: Neither 'main' nor 'master' branch found."
            exit 1
          fi
          
          UPSTREAM_SHA=$(git rev-parse $UPSTREAM_BRANCH)
          echo "Target Commit: $UPSTREAM_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          git checkout $UPSTREAM_SHA

      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: env.BUILD_NEEDED == 'true'
        uses: android-actions/setup-android@v3

      # === 以下、修正の核心部分 ===

      - name: Apply Package & Scope Changes
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 変更処理開始 ==="
          OLD_PKG="io.github.hiro.lime"
          NEW_PKG="io.github.fork.lime"
          
          # 1. パッケージ名置換 (全ファイル対象)
          find . -type f \( -name "*.xml" -o -name "*.java" -o -name "*.kt" -o -name "*.gradle" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # 2. AndroidManifest.xml の xposedscope を強制書き換え (Clone対応)
          #    確実に1行ヒットさせて書き換える
          find . -name "AndroidManifest.xml" ! -path "*/build/*" | while read manifest; do
             # 念のため置換前の状態を確認
             grep "xposedscope" "$manifest" || true
             # 置換実行
             sed -i 's|android:value="jp.naver.line.android"|android:value="jp.naver.line.android.clone"|g' "$manifest"
          done

          # 3. ソースコードのロジック緩和 (Clone対応)
          #    完全一致(==) を 前方一致(.startsWith) に変更
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|== "jp.naver.line.android"|.startsWith("jp.naver.line.android")|g' {} +
             
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|!= "jp.naver.line.android"|!it.packageName.startsWith("jp.naver.line.android")|g' {} +
             
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|equals("jp.naver.line.android")|startsWith("jp.naver.line.android")|g' {} +

          echo "=== 変更処理完了 ==="

      # === 【NEW】デバッグレポート生成（ここに注目） ===
      - name: Generate Debug Report
        if: env.BUILD_NEEDED == 'true'
        run: |
          REPORT_FILE="debug_report.txt"
          echo "=== DEBUG REPORT (${{ env.BUILD_DATE }}) ===" > $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          echo "1. AndroidManifest.xml Scope Check:" >> $REPORT_FILE
          echo "-----------------------------------" >> $REPORT_FILE
          # xposedscopeを含む行を抽出して表示
          grep -r "xposedscope" . --include="AndroidManifest.xml" -A 1 >> $REPORT_FILE || echo "xposedscope NOT FOUND" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          echo "2. Package Name Check (io.github.fork.lime):" >> $REPORT_FILE
          echo "-----------------------------------" >> $REPORT_FILE
          # 新しいパッケージ名が含まれているか確認
          grep -r "io.github.fork.lime" . --include="AndroidManifest.xml" | head -n 3 >> $REPORT_FILE
          echo "" >> $REPORT_FILE

          echo "3. Hook Logic Check (startsWith):" >> $REPORT_FILE
          echo "-----------------------------------" >> $REPORT_FILE
          # 前方一致に変更されたロジックを検索して表示
          grep -r "startsWith(\"jp.naver.line.android\")" . --include="*.kt" | head -n 5 >> $REPORT_FILE || echo "Hook logic modification FAILED" >> $REPORT_FILE
          
          echo "" >> $REPORT_FILE
          echo "=== END REPORT ===" >> $REPORT_FILE
          
          # ログにも出力（コピペ用）
          cat $REPORT_FILE

      - name: Unify Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            done
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            done

      - name: Set Gradle Permissions
        if: env.BUILD_NEEDED == 'true'
        run: |
          if [[ -f "gradlew" ]]; then chmod +x gradlew; fi

      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          ./gradlew clean || true
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleRelease --no-daemon
          fi
          if [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Debug Build ${{ env.SHORT_SHA }}
          body: |
            # 🛠 Debug Build
            
            - **Source**: ${{ env.SHORT_SHA }}
            - **Target**: jp.naver.line.android.clone
            
            Please verify `debug_report.txt` to ensure patching was successful.
          draft: false
          prerelease: false
          files: |
            **/build/outputs/apk/**/*.apk
            *.apk
            debug_report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

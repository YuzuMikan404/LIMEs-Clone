name: LIMEs-Neo Daily Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: true
        type: boolean
      build_type:
        description: 'ビルドタイプ'
        required: false
        default: 'release'
        type: string
        options:
          - release
          - debug
          - both
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      APP_NAME: "LIMEs-Neo"

    steps:
      - name: Debug Workflow Dispatch Inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Determine Trigger Type
        id: trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "FORCE_REBUILD=${{ github.event.inputs.force_rebuild }}" >> $GITHUB_ENV
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            [[ -z "$BUILD_TYPE" ]] && BUILD_TYPE="release"
            echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          else
            echo "TRIGGER_TYPE=other" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "TARGET_TAG=build-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV

      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || true
          echo "Fetching upstream..."
          git fetch upstream
          
          # ブランチ名の自動判定 (main または master)
          if git rev-parse --verify upstream/main >/dev/null 2>&1; then
            echo "Branch 'main' found."
            UPSTREAM_BRANCH="upstream/main"
          elif git rev-parse --verify upstream/master >/dev/null 2>&1; then
            echo "Branch 'master' found."
            UPSTREAM_BRANCH="upstream/master"
          else
            echo "Error: Neither 'main' nor 'master' branch found in upstream."
            exit 1
          fi
          
          UPSTREAM_SHA=$(git rev-parse $UPSTREAM_BRANCH)
          echo "Target Commit: $UPSTREAM_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          git checkout $UPSTREAM_SHA

      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: env.BUILD_NEEDED == 'true'
        uses: android-actions/setup-android@v3

      # === デバッグ保存 (Before) ===
      # 重要: ! -path "*/debug_artifacts/*" を追加して自分自身をコピーしないように修正
      - name: Save Files Before Modification (Debug)
        if: env.BUILD_NEEDED == 'true'
        run: |
          mkdir -p debug_artifacts/before
          
          echo "保存中: AndroidManifest.xml"
          find . -name "AndroidManifest.xml" ! -path "*/build/*" ! -path "*/debug_artifacts/*" \
            -exec cp --parents {} debug_artifacts/before/ \;
          
          echo "保存中: 主要なKotlinファイル"
          find . -name "*.kt" ! -path "*/build/*" ! -path "*/debug_artifacts/*" | head -n 20 | \
            xargs -I {} cp --parents {} debug_artifacts/before/

      # === 置換処理 ===
      # 重要: ここでも ! -path "*/debug_artifacts/*" を追加してバックアップを書き換えないように修正
      - name: Apply Package & Scope Changes
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 変更処理開始 ==="
          
          OLD_PKG="io.github.hiro.lime"
          NEW_PKG="io.github.fork.lime"
          
          # 1. パッケージ名置換
          echo "パッケージ名置換実行"
          find . -type f \( -name "*.xml" -o -name "*.java" -o -name "*.kt" -o -name "*.gradle" \) \
            ! -path "*/build/*" ! -path "*/.git/*" ! -path "*/debug_artifacts/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # 2. AndroidManifest.xml の強制修正 (Clone対応)
          echo "AndroidManifestのスコープ修正"
          find . -name "AndroidManifest.xml" ! -path "*/build/*" ! -path "*/debug_artifacts/*" | while read manifest; do
            echo "Processing: $manifest"
            sed -i 's|android:value="jp.naver.line.android"|android:value="jp.naver.line.android.clone"|g' "$manifest"
          done

          # 3. ソースコードのロジック緩和 (Clone対応)
          echo "ソースコードの判定ロジック緩和"
          
          # '==' -> '.startsWith'
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" ! -path "*/debug_artifacts/*" \
             -exec sed -i 's|== "jp.naver.line.android"|.startsWith("jp.naver.line.android")|g' {} +
             
          # '!=' -> '!...startsWith'
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" ! -path "*/debug_artifacts/*" \
             -exec sed -i 's|!= "jp.naver.line.android"|!it.packageName.startsWith("jp.naver.line.android")|g' {} +
             
          # 'equals' -> 'startsWith'
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" ! -path "*/debug_artifacts/*" \
             -exec sed -i 's|equals("jp.naver.line.android")|startsWith("jp.naver.line.android")|g' {} +

          echo "=== 変更処理完了 ==="

      # === デバッグ保存 (After) ===
      - name: Save Files After Modification (Debug)
        if: env.BUILD_NEEDED == 'true'
        run: |
          mkdir -p debug_artifacts/after
          
          echo "保存中: AndroidManifest.xml"
          find . -name "AndroidManifest.xml" ! -path "*/build/*" ! -path "*/debug_artifacts/*" \
            -exec cp --parents {} debug_artifacts/after/ \;
          
          echo "保存中: 主要なKotlinファイル"
          find . -name "*.kt" ! -path "*/build/*" ! -path "*/debug_artifacts/*" | head -n 20 | \
            xargs -I {} cp --parents {} debug_artifacts/after/
          
          echo "ZIP作成中..."
          zip -r debug_files.zip debug_artifacts/

      - name: Unify Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" ! -path "*/debug_artifacts/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            done
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" ! -path "*/debug_artifacts/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            done

      - name: Set Gradle Permissions
        if: env.BUILD_NEEDED == 'true'
        run: |
          if [[ -f "gradlew" ]]; then chmod +x gradlew; fi

      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          ./gradlew clean || true
          
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleRelease --no-daemon
          fi
          if [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Debug Build ${{ env.SHORT_SHA }}
          body: |
            # 🛠 Debug Build
            
            - **Source**: ${{ env.SHORT_SHA }}
            - **Target**: jp.naver.line.android.clone
            
            ## 🐞 Debugging
            - Download `debug_files.zip`
            - Compare `before/` vs `after/` to verify `AndroidManifest.xml` changes.
            - Check `xposedscope` value in manifest.
          draft: false
          prerelease: false
          files: |
            **/build/outputs/apk/**/*.apk
            *.apk
            debug_files.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

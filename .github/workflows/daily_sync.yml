name: LIMEs-Neo Daily Build

permissions:
  contents: write
  packages: read  # パッケージ権限を追加

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日0時（UTC）に実行
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'false'

env:
  # グローバル環境変数
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"

    steps:
      # ステップ1: 現在のリポジトリをチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # ステップ2: Android SDKのセットアップ（ビルドエラー防止）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      # ステップ3: 手動実行の場合は即座にビルドを開始
      - name: Check Trigger Type
        id: trigger-check
        run: |
          echo "=== トリガータイプの確認 ==="
          echo "イベントタイプ: ${{ github.event_name }}"
          
          # 手動トリガーの場合は常にビルド
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動トリガーを検出しました。ビルドを開始します。"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "BUILD_REASON=手動実行" >> $GITHUB_ENV
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            
            # 強制再ビルドの設定
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            echo "強制再ビルド設定: $FORCE_REBUILD"
            echo "FORCE_REBUILD=$FORCE_REBUILD" >> $GITHUB_ENV
          else
            echo "::notice::スケジュール実行を検出しました。アップストリームをチェックします。"
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
          fi

      # ステップ4: スケジュール実行の場合のみアップストリームをチェック
      - name: Check Upstream for Scheduled Runs
        if: env.TRIGGER_TYPE == 'scheduled'
        id: check-upstream
        run: |
          echo "=== アップストリームリポジトリの確認（スケジュール実行）==="
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリームリポジトリからSHAを取得できませんでした。"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "基本タグ名: $BASE_TAG"
          
          # 既存タグをチェック
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "::notice::コミット $SHORT_SHA のビルドは既に存在します。スキップします。"
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
            echo "SKIP_REASON=既存ビルド" >> $GITHUB_ENV
          else
            echo "::notice::新しいコミットを検出！ビルドを開始します。"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "BUILD_REASON=定期スケジュール" >> $GITHUB_ENV
            echo "TAG_STRATEGY=new" >> $GITHUB_ENV
          fi

      # ステップ5: 手動実行の場合のタグ決定
      - name: Determine Tag for Manual Run
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        id: manual-tag
        run: |
          echo "=== 手動実行のタグ設定 ==="
          
          # アップストリームの最新コミットを取得
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_ENV
          
          # 強制再ビルドの設定に基づいてタグを決定
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "::notice::強制再ビルドモード: 既存タグを上書きします"
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "TAG_STRATEGY=overwrite" >> $GITHUB_ENV
          else
            # タイムスタンプ付きのタグを作成
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "::notice::新しい手動ビルドタグ: $TARGET_TAG"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            echo "TAG_STRATEGY=new" >> $GITHUB_ENV
          fi

      # ステップ6: ビルド日時を取得
      - name: Get build datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "short_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      # ステップ7: アップストリームからソースコードを取得
      - name: Fetch & Checkout Upstream Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アップストリームソースコードを取得: ${{ env.SHORT_SHA }} ==="
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # アップストリームリポジトリを追加してフェッチ
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          
          # 特定のコミットをチェックアウト
          git checkout $UPSTREAM_SHA
          
          echo "ソースコードの取得が完了しました。"

      # ステップ8: リポジトリ構造のデバッグ（アプリ名確認）
      - name: Debug - Check current app name
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 現在のアプリ名確認 ==="
          echo "アプリ名設定対象: $APP_NAME"
          
          # strings.xmlの確認
          echo "strings.xmlファイル検索:"
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            echo "ファイル: $file"
            if grep -q "app_name" "$file"; then
              echo "  app_name定義:"
              grep -n "app_name" "$file"
            fi
          done
          
          # AndroidManifest.xmlの確認
          echo ""
          echo "AndroidManifest.xmlファイル検索:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -3 | while read file; do
            echo "ファイル: $file"
            grep -n "android:label\|application" "$file" | head -5
          done

      # ステップ9: パッケージ名とアプリ名をリファクタリング（改善版）
      - name: Refactor Package & App Names
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== パッケージ名とアプリ名のリファクタリング ==="
          
          # 元のパッケージ名（複数パターンを想定）
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          echo "置換設定:"
          echo "  $OLD_PKG → $NEW_PKG"
          echo "  $OLD_LINE → $NEW_LINE_PKG"
          echo "  アプリ名 → $APP_NAME"
          
          # 1. パッケージ名の置換（より包括的に）
          echo ""
          echo "1. パッケージ名を置換しています..."
          
          # Kotlin/Javaファイル
          find . -type f \( -name "*.kt" -o -name "*.java" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG" {} \; 2>/dev/null | while read file; do
            echo "  Kotlin/Java: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
          done
          
          # XMLファイル
          find . -type f -name "*.xml" \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  XML: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
          done
          
          # Gradleファイル
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$OLD_PKG\|$OLD_LINE" {} \; 2>/dev/null | while read file; do
            echo "  Gradle: $file"
            sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
            sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
          done
          
          # 2. ディレクトリ構造の変更（エラー処理を強化）
          echo ""
          echo "2. パッケージディレクトリを移動しています..."
          
          TARGET_DIRS=$(find . -type d -path "*/io/github/hiro/lime" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null || echo "")
          
          if [ -n "$TARGET_DIRS" ]; then
            echo "移動対象ディレクトリを検出:"
            for DIR in $TARGET_DIRS; do
              echo "  $DIR"
              if [ -d "$DIR" ]; then
                PARENT_DIR=$(dirname "$DIR")
                GRANDPARENT_DIR=$(dirname "$PARENT_DIR")
                DEST_DIR="$GRANDPARENT_DIR/fork/lime"
                
                mkdir -p "$(dirname "$DEST_DIR")"
                if mv "$DIR" "$DEST_DIR" 2>/dev/null; then
                  echo "    → $DEST_DIR に移動成功"
                  
                  # 空ディレクトリの削除（エラーは無視）
                  rmdir "$PARENT_DIR" 2>/dev/null || true
                  rmdir "$(dirname "$PARENT_DIR")" 2>/dev/null || true
                else
                  echo "    → 移動失敗（スキップ）"
                fi
              fi
            done
          else
            echo "移動対象ディレクトリはありません"
          fi
          
          # 3. アプリ名の変更（確実に変更する方法）
          echo ""
          echo "3. アプリ名を '$APP_NAME' に変更しています..."
          
          # strings.xml内のapp_nameを置換（複数パターン対応）
          echo "  strings.xmlの処理:"
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            echo "    ファイル: $file"
            
            # 現在のapp_nameを表示
            CURRENT_NAME=$(grep -o 'name="app_name"[^>]*>[^<]*</string>' "$file" | sed -n 's/.*>\([^<]*\)<\/string>/\1/p' | head -1)
            if [ -n "$CURRENT_NAME" ]; then
              echo "      現在: '$CURRENT_NAME' → '$APP_NAME'"
            fi
            
            # パターン1: <string name="app_name">値</string>
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">'"$APP_NAME"'</string>|g' "$file"
            
            # パターン2: name="app_name" 属性を持つstring要素
            sed -i 's|name="app_name"[^>]*>[^<]*</string>|name="app_name">'"$APP_NAME"'</string>|g' "$file"
            
            # パターン3: その他のapp_name表記
            sed -i 's|"app_name"[^>]*>[^<]*</string>|"app_name">'"$APP_NAME"'</string>|g' "$file"
            
            # 変更後の確認
            NEW_NAME=$(grep -o 'name="app_name"[^>]*>[^<]*</string>' "$file" | sed -n 's/.*>\([^<]*\)<\/string>/\1/p' | head -1)
            if [ -n "$NEW_NAME" ]; then
              echo "      変更後: '$NEW_NAME'"
            else
              # app_nameが存在しない場合は追加
              if grep -q "<resources>" "$file"; then
                sed -i 's|<resources>|<resources>\n    <string name="app_name">'"$APP_NAME"'</string>|' "$file"
                echo "      新規追加: '$APP_NAME'"
              fi
            fi
          done
          
          # AndroidManifest.xmlの確認
          echo ""
          echo "  AndroidManifest.xmlの確認:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -2 | while read file; do
            echo "    ファイル: $file"
            if grep -q "android:label" "$file"; then
              echo "      android:label定義を確認"
            else
              echo "      android:label定義なし"
            fi
          done
          
          echo ""
          echo "リファクタリング完了！"

      # ステップ10: リファクタリング後の確認
      - name: Verify refactoring results
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== リファクタリング結果の確認 ==="
          
          echo "1. アプリ名の確認:"
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" -exec grep -H "app_name" {} \; 2>/dev/null | head -5 || echo "    app_name定義なし"
          
          echo ""
          echo "2. パッケージ名の確認:"
          echo "   新しいパッケージ名 ($NEW_PKG) の検索:"
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec grep -l "$NEW_PKG" {} \; 2>/dev/null | head -3 | while read file; do
            echo "      $file"
          done || echo "      該当ファイルなし"
          
          echo ""
          echo "3. ディレクトリ構造の確認:"
          find . -type d -path "*/fork/lime" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | head -3 | while read dir; do
            echo "      $dir"
          done || echo "      該当ディレクトリなし"

      # ステップ11: Java環境のセットアップ
      - name: Setup Java Environment
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ12: キャッシュを有効化（ビルド速度向上）
      - name: Cache Gradle dependencies
        if: env.BUILD_NEEDED == 'true'
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ステップ13: APKのビルド（エラー処理を強化）
      - name: Build APK with error handling
        if: env.BUILD_NEEDED == 'true'
        id: build-apk
        run: |
          echo "=== APKビルドを開始 ==="
          
          # 実行権限を付与
          chmod +x gradlew
          
          # ビルド前の最終確認
          echo "ビルド前確認:"
          echo "  作業ディレクトリ: $(pwd)"
          echo "  Gradleバージョン:"
          ./gradlew --version || echo "  Gradleバージョン確認失敗"
          
          # クリーンビルドを試行（キャッシュ問題を防止）
          echo ""
          echo "1. クリーンビルドを実行..."
          if ./gradlew clean; then
            echo "  ✅ クリーンビルド成功"
          else
            echo "  ⚠️  クリーンビルド失敗（続行）"
          fi
          
          echo ""
          echo "2. 依存関係を解決..."
          if ./gradlew dependencies --info 2>&1 | tail -20; then
            echo "  ✅ 依存関係解決完了"
          else
            echo "  ⚠️  依存関係解決中に警告"
          fi
          
          echo ""
          echo "3. リリース版APKをビルド..."
          MAX_RETRIES=2
          RETRY_COUNT=0
          BUILD_SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$BUILD_SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "  試行 $RETRY_COUNT/$MAX_RETRIES"
            
            if ./gradlew assembleRelease --stacktrace --info; then
              BUILD_SUCCESS=true
              echo "  ✅ リリース版APKビルド成功"
              echo "BUILD_RESULT=release" >> $GITHUB_ENV
              echo "BUILD_ATTEMPTS=$RETRY_COUNT" >> $GITHUB_ENV
            else
              echo "  ❌ リリース版ビルド失敗（試行 $RETRY_COUNT）"
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "  5秒待機して再試行..."
                sleep 5
              fi
            fi
          done
          
          # リリース版が失敗した場合、デバッグ版を試行
          if [ "$BUILD_SUCCESS" = false ]; then
            echo ""
            echo "4. デバッグ版APKをビルド..."
            if ./gradlew assembleDebug --stacktrace --info; then
              echo "  ✅ デバッグ版APKビルド成功"
              echo "BUILD_RESULT=debug" >> $GITHUB_ENV
              echo "BUILD_ATTEMPTS=$RETRY_COUNT" >> $GITHUB_ENV
              BUILD_SUCCESS=true
            else
              echo "  ❌ デバッグ版ビルドにも失敗"
              echo ""
              echo "=== ビルド失敗の詳細 ==="
              echo "最後のエラーを表示:"
              find . -name "*.log" -type f | head -3 | while read log; do
                echo "ログファイル: $log"
                tail -50 "$log" 2>/dev/null || true
              done
              
              # ビルドエラーの一般的な原因を表示
              echo ""
              echo "考えられる原因:"
              echo "1. パッケージ名の変更が不完全"
              echo "2. 依存関係の不足"
              echo "3. Android SDKのバージョン不一致"
              echo "4. 権限の問題"
              
              exit 1
            fi
          fi
          
          echo ""
          echo "=== ビルド結果 ==="
          echo "結果: $BUILD_RESULT"
          echo "試行回数: $BUILD_ATTEMPTS"
          
          # 生成されたAPKを確認
          echo ""
          echo "生成されたAPKファイル:"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "  $apk ($(du -h "$apk" | cut -f1))"
          done || echo "  APKファイルが見つかりません"

      # ステップ14: リリースを作成
      - name: Create LIMEs-Neo Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Build ${{ env.SHORT_SHA }}
          body: |
            # 🚀 LIMEs-Neo - 自動ビルド
            
            ## 📋 ビルド情報
            - **アプリ名**: LIMEs-Neo
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            - **ソースリポジトリ**: [${{ env.SOURCE_REPO }}](https://github.com/${{ env.SOURCE_REPO }})
            - **実行種別**: ${{ env.BUILD_REASON }}
            - **ビルド種別**: ${{ env.BUILD_RESULT == 'release' && 'リリース版' || 'デバッグ版' }}
            - **ビルド試行回数**: ${{ env.BUILD_ATTEMPTS || '1' }}
            
            ## 📦 パッケージ情報
            - **メインパッケージ名**: `${{ env.NEW_PKG }}`
            - **LINEパッケージ名**: `${{ env.NEW_LINE_PKG }}`
            
            ## 📝 注意事項
            このビルドはオリジナルアプリとの衝突を避けるため、パッケージ名をリファクタリングした自動フォークビルドです。
            
            ### 変更点:
            1. パッケージ名を `io.github.hiro.lime` → `${{ env.NEW_PKG }}` に変更
            2. LINEパッケージ名を `jp.naver.line.android` → `${{ env.NEW_LINE_PKG }}` に変更
            3. アプリ名を LIMEs-Neo に設定
            
            ---
            *このリリースはGitHub Actionsワークフローによって自動生成されました。*
          draft: false
          prerelease: false
          overwrite: ${{ env.TAG_STRATEGY == 'overwrite' && true || false }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ15: ビルド失敗時のフォールバック
      - name: Create Fallback Release on Build Failure
        if: env.BUILD_NEEDED == 'true' && failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}-failed
          name: "[FAILED] LIMEs-Neo Build ${{ env.SHORT_SHA }}"
          body: |
            # ❌ LIMEs-Neo - ビルド失敗
            
            ## 📋 エラー情報
            - **アプリ名**: LIMEs-Neo
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            - **実行種別**: ${{ env.BUILD_REASON }}
            - **ステータス**: ビルド失敗
            
            ## 🐛 トラブルシューティング
            ビルドが失敗しました。以下の点を確認してください:
            
            1. **パッケージ名の変更**が正しく行われているか
            2. **依存関係**が解決できているか
            3. **Android SDK**のバージョンが適切か
            4. ソースコードに**構文エラー**がないか
            
            ## 📝 ログ確認
            GitHub Actionsの実行ログを確認して、具体的なエラーメッセージを確認してください。
            
            ---
            *このリリースはビルド失敗を示すために作成されました。*
          draft: false
          prerelease: true
          files: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ16: ビルド完了通知
      - name: Build Complete Notification
        if: always()
        run: |
          echo "=== ビルドプロセス完了 ==="
          echo "最終ステータス: ${{ job.status }}"
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド成功！"
            echo "アプリ名: LIMEs-Neo"
            echo "ソースコミット: ${{ env.SHORT_SHA }}"
            echo "リリースタグ: ${{ env.TARGET_TAG }}"
            echo "ビルド種別: ${{ env.BUILD_RESULT }}"
            echo "実行理由: ${{ env.BUILD_REASON }}"
            echo ""
            echo "📦 リリースページ:"
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"
          else
            echo "❌ ビルド失敗"
            echo "失敗したステップを確認してください"
            echo ""
            echo "🔍 デバッグ情報:"
            echo "1. ワークフローログを確認"
            echo "2. アプリ名の変更が正しいか確認"
            echo "3. パッケージ名の置換を確認"
          fi

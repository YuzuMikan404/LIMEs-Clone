name: LIMEs-Neo Daily Build

on:
  # 手動トリガー（GitHub UIから実行可能）
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'true'
        type: boolean
      build_type:
        description: 'ビルドタイプ'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
  
  # スケジュール実行（毎日UTC 0時）
  schedule:
    - cron: '0 0 * * *'
  
  # プッシュトリガー（任意、必要に応じて）
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  
  # プルリクエストトリガー（任意、必要に応じて）
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"

    steps:
      # ステップ1: 手動トリガー入力の確認（デバッグ用）
      - name: Debug Workflow Dispatch Inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== 手動トリガー入力確認 ==="
          echo "GitHub Event Name: ${{ github.event_name }}"
          echo "Force Rebuild Input: ${{ github.event.inputs.force_rebuild }}"
          echo "Build Type Input: ${{ github.event.inputs.build_type }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub SHA: ${{ github.sha }}"

      # ステップ2: リポジトリチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      # ステップ3: トリガー種別判定
      - name: Determine Trigger Type
        id: trigger
        run: |
          echo "=== トリガー種別判定 ==="
          echo "イベント名: ${{ github.event_name }}"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動実行モード"
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            
            # 手動実行時は常にビルド
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            
            # 入力パラメータの処理
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            if [[ -z "$FORCE_REBUILD" || "$FORCE_REBUILD" == "true" ]]; then
              echo "FORCE_REBUILD=true" >> $GITHUB_ENV
            else
              echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            fi
            
            # ビルドタイプの処理
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            if [[ -z "$BUILD_TYPE" ]]; then
              BUILD_TYPE="release"
            fi
            echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
            
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "::notice::スケジュール実行モード"
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            
          else
            echo "::notice::その他のトリガー: ${{ github.event_name }}"
            echo "TRIGGER_TYPE=other" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          fi
          
          echo "設定完了:"
          echo "  TRIGGER_TYPE=$TRIGGER_TYPE"
          echo "  BUILD_NEEDED=$BUILD_NEEDED"
          echo "  FORCE_REBUILD=$FORCE_REBUILD"
          echo "  BUILD_TYPE=$BUILD_TYPE"

      # ステップ4: スケジュール実行時のチェック
      - name: Check for Scheduled Build
        if: env.TRIGGER_TYPE == 'scheduled'
        id: schedule-check
        run: |
          echo "=== スケジュール実行チェック ==="
          
          # アップストリームから最新コミットを取得
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "想定タグ名: $BASE_TAG"
          
          # 既存のタグをチェック
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "::notice::既存ビルドあり - スキップします"
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            echo "::notice::新規ビルドが必要です"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          fi

      # ステップ5: 手動実行時の設定
      - name: Setup Manual Build
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        id: manual-setup
        run: |
          echo "=== 手動実行設定 ==="
          
          # アップストリームから最新コミットを取得
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "ベースタグ名: $BASE_TAG"
          
          # 環境変数の設定
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          # 強制再ビルドかどうかでタグ名を決定
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "::notice::強制上書きモード - 既存タグを上書きします"
          else
            # 手動実行用の一意なタグ名を生成
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            echo "::notice::新規ビルドモード - 新しいタグを作成します"
          fi
          
          echo "最終タグ名: $TARGET_TAG"

      # ステップ6: その他のトリガー時の設定
      - name: Setup Other Trigger Build
        if: env.TRIGGER_TYPE == 'other' && env.BUILD_NEEDED == 'true'
        id: other-setup
        run: |
          echo "=== その他のトリガー設定 ==="
          
          # 現在のコミットを使用
          CURRENT_SHA="${{ github.sha }}"
          SHORT_SHA=${CURRENT_SHA:0:7}
          
          # イベントに基づいたタグ名を生成
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TARGET_TAG="build-$SHORT_SHA-push-$TIMESTAMP"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TARGET_TAG="build-pr-$PR_NUMBER-$TIMESTAMP"
          else
            TARGET_TAG="build-$SHORT_SHA-$TIMESTAMP"
          fi
          
          echo "UPSTREAM_SHA=$CURRENT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          
          echo "トリガー: ${{ github.event_name }}"
          echo "タグ名: $TARGET_TAG"

      # ステップ7: ビルド不要な場合は終了
      - name: Skip Build if Not Needed
        if: env.BUILD_NEEDED != 'true'
        run: |
          echo "=== ビルド不要 ==="
          echo "現在のコミットに対するビルドは既に存在します。"
          echo "ビルドをスキップします。"
          exit 0

      # ステップ8: ビルド日時取得
      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "ビルド日時を取得中..."
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
          echo "date_short=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV

      # ステップ9: ソースコード取得
      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ソースコード取得 ==="
          
          # Git設定
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # アップストリームリポジトリを追加
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || echo "アップストリームは既に追加済み"
          
          # アップストリームからフェッチ
          echo "アップストリームからフェッチ中..."
          git fetch upstream
          
          # 指定のコミットにチェックアウト
          echo "コミット $UPSTREAM_SHA をチェックアウト"
          git checkout $UPSTREAM_SHA
          
          # 確認
          echo "現在のコミット:"
          git log --oneline -1

      # ステップ10: Java環境セットアップ
      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ11: Android SDKセットアップ
      - name: Setup Android SDK
        if: env.BUILD_NEEDED == 'true'
        uses: android-actions/setup-android@v3

      # ステップ12: パッケージ名置換（LSPatch対応版）
      - name: Replace Package Names for LSPatch
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用パッケージ名置換 ==="
          
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          NEW_PKG="io.github.fork.lime"
          NEW_LINE_PKG="jp.naver.line.android.clone"
          
          echo "置換設定:"
          echo "  $OLD_PKG → $NEW_PKG"
          echo "  $OLD_LINE → $NEW_LINE_PKG"
          
          # AndroidManifest.xmlの処理
          echo "1. AndroidManifest.xmlの処理..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              echo "  処理中: $file"
              # 安全な置換
              sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
              sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            done
          
          # その他のファイル処理
          echo "2. その他ファイルの処理..."
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            ! -path "*/build/*" ! -path "*/.git/*" ! -name "AndroidManifest.xml" 2>/dev/null | \
            while read file; do
              if [[ -f "$file" ]]; then
                sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file" 2>/dev/null || true
                sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file" 2>/dev/null || true
              fi
            done
          
          echo "パッケージ名置換完了"

      # ステップ13: LINE-Neoマニフェストにxposedscopeを追加（修正版）
      - name: Add xposedscope to LINE-Neo Manifest
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LINE-Neoマニフェストにxposedscopeを追加 ==="
          
          # LINE-Neoのマニフェストを検索
          TARGET_MANIFEST=$(find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            xargs grep -l "jp.naver.line.android" 2>/dev/null | head -1)
          
          if [[ -z "$TARGET_MANIFEST" ]]; then
            TARGET_MANIFEST=$(find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | head -1)
          fi
          
          if [[ -n "$TARGET_MANIFEST" ]]; then
            echo "ターゲットマニフェスト: $TARGET_MANIFEST"
            
            # Pythonを使用してXMLを安全に編集
            python3 << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          import sys
          
          manifest_path = "$TARGET_MANIFEST"
          
          try:
              # XMLをパース
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              
              # android名前空間
              ns = {'android': 'http://schemas.android.com/apk/res/android'}
              
              # applicationタグを取得
              application = root.find('application')
              
              if application is not None:
                  # 既存のxposedscopeを削除
                  for meta in application.findall('meta-data'):
                      name = meta.get('{http://schemas.android.com/apk/res/android}name')
                      if name == 'xposedscope':
                          application.remove(meta)
                  
                  # 新しいmeta-dataを追加
                  meta_data = ET.Element('meta-data')
                  meta_data.set('{http://schemas.android.com/apk/res/android}name', 'xposedscope')
                  meta_data.set('{http://schemas.android.com/apk/res/android}value', 'io.github.fork.lime')
                  application.insert(0, meta_data)
                  
                  # 保存
                  tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
                  print("✓ xposedscopeを追加しました")
              else:
                  print("エラー: applicationタグが見つかりません")
                  sys.exit(1)
          
          except Exception as e:
              print(f"エラー: {e}")
              sys.exit(1)
          PYTHON_SCRIPT
          
          # 置換を実行（manifest_pathを実際のパスに置き換え）
          python3 << PYTHON_SCRIPT
          import xml.etree.ElementTree as ET
          import sys
          
          manifest_path = "${TARGET_MANIFEST}"
          
          try:
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              
              ns = {'android': 'http://schemas.android.com/apk/res/android'}
              application = root.find('application')
              
              if application is not None:
                  for meta in application.findall('meta-data'):
                      name = meta.get('{http://schemas.android.com/apk/res/android}name')
                      if name == 'xposedscope':
                          application.remove(meta)
                  
                  meta_data = ET.Element('meta-data')
                  meta_data.set('{http://schemas.android.com/apk/res/android}name', 'xposedscope')
                  meta_data.set('{http://schemas.android.com/apk/res/android}value', 'io.github.fork.lime')
                  application.insert(0, meta_data)
                  
                  tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
                  print("✓ xposedscopeを追加しました: io.github.fork.lime")
              else:
                  print("エラー: applicationタグが見つかりません")
                  sys.exit(1)
          
          except Exception as e:
              print(f"エラー: {e}")
              sys.exit(1)
          PYTHON_SCRIPT
          
          fi

      # ステップ14: アプリ名の統一設定
      - name: Unify Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アプリ名の統一設定 ==="
          
          # マニフェストファイルでアプリ名を統一
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            done
          
          # strings.xmlのapp_nameも更新
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            done

      # ステップ15: Gradle権限設定
      - name: Set Gradle Permissions
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== Gradle権限設定 ==="
          if [[ -f "gradlew" ]]; then
            chmod +x gradlew
            echo "gradlewに実行権限を付与"
          fi

      # ステップ16: APKビルド実行
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルド実行 ==="
          
          # ビルドタイプに基づいてビルド
          BUILD_COMMANDS=()
          
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            BUILD_COMMANDS+=("assembleRelease")
          fi
          
          if [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "both" ]]; then
            BUILD_COMMANDS+=("assembleDebug")
          fi
          
          echo "実行するビルドコマンド: ${BUILD_COMMANDS[@]}"
          
          # クリーンビルド
          ./gradlew clean 2>&1 | tail -20 || echo "クリーンビルド警告"
          
          # 各ビルドを実行
          for cmd in "${BUILD_COMMANDS[@]}"; do
            echo "実行中: ./gradlew $cmd"
            if ./gradlew $cmd --stacktrace --no-daemon 2>&1; then
              echo "✅ $cmd 成功"
              echo "BUILD_RESULT=${cmd#assemble}" >> $GITHUB_ENV
            else
              echo "❌ $cmd 失敗"
              # 失敗時はデバッグ情報を出力
              ./gradlew $cmd --stacktrace 2>&1 | tail -100
              exit 1
            fi
          done
          
          # 生成されたAPKを表示
          echo "生成されたAPKファイル:"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            SIZE=$(du -h "$apk" | cut -f1)
            echo "  - $apk ($SIZE)"
          done

      # ステップ17: GitHubリリース作成
      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo ${{ env.SHORT_SHA }} (${{ env.BUILD_DATE }})
          body: |
            # 🚀 LIMEs-Neo - LSPatch対応ビルド
            
            ## 📋 ビルド情報
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
            - **ビルド種別**: ${{ env.BUILD_TYPE }}
            - **トリガー**: ${{ env.TRIGGER_TYPE }}
            - **タグ**: ${{ env.TARGET_TAG }}
            
            ## 🎯 LSPatch設定
            **ターゲットAPK**: `jp.naver.line.android.clone` (LIMEs-Neo)
            **モジュール**: `io.github.fork.lime`
            
            ## 🔧 変更点
            1. パッケージ名を変更してオリジナルアプリと競合しないようにしました
            2. LSPatch用にxposedscopeを適切に設定
            3. アプリ名を統一
            
            ## 📦 ダウンロード
            以下のAPKファイルが利用可能です。
            
            ## ⚠️ 注意事項
            - LSPatch 1.10.2以上を使用してください
            - 埋め込みモードでの適用を推奨します
            
            ---
            *GitHub Actionsによる自動ビルド*
          draft: false
          prerelease: false
          overwrite: ${{ env.FORCE_REBUILD == 'true' && true || false }}
          files: |
            **/build/outputs/apk/**/*.apk
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ18: ビルド完了通知
      - name: Build Completion Notification
        if: always()
        run: |
          echo "=== ビルド完了 ==="
          echo "ステータス: ${{ job.status }}"
          echo ""
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド成功！"
            echo ""
            echo "📊 サマリー:"
            echo "- アプリ名: LIMEs-Neo"
            echo "- ターゲットパッケージ: $NEW_LINE_PKG"
            echo "- モジュールパッケージ: $NEW_PKG"
            echo "- ビルドタグ: ${{ env.TARGET_TAG || '未設定' }}"
            echo "- ビルド日時: ${{ env.BUILD_DATE || '不明' }}"
            
            # リリースリンク
            if [[ -n "${{ env.TARGET_TAG }}" ]]; then
              echo ""
              echo "🔗 リリースページ:"
              echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"
            fi
          else
            echo "❌ ビルド失敗"
            echo ""
            echo "🔧 デバッグ情報:"
            echo "- イベント: ${{ github.event_name }}"
            echo "- トリガー: ${{ env.TRIGGER_TYPE || '不明' }}"
            echo "- ワークフロー: ${{ github.workflow }}"
            echo "- リポジトリ: ${{ github.repository }}"
          fi
```

## 主な変更点

**ステップ13（LINE-Neoマニフェストにxposedscopeを追加）**を完全に書き直しました：

1. **sedコマンドを削除** - XMLを壊す原因となっていた
2. **Pythonスクリプトを使用** - XML構文を適切に保持
3. **xml.etree.ElementTreeを使用** - XMLを安全にパース・編集

これで、AndroidManifest.xmlが壊れることなく、正しくxposedscopeが追加されます。ー入力確認 ==="
          echo "GitHub Event Name: ${{ github.event_name }}"
          echo "Force Rebuild Input: ${{ github.event.inputs.force_rebuild }}"
          echo "Build Type Input: ${{ github.event.inputs.build_type }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub SHA: ${{ github.sha }}"

      # ステップ2: リポジトリチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      # ステップ3: トリガー種別判定
      - name: Determine Trigger Type
        id: trigger
        run: |
          echo "=== トリガー種別判定 ==="
          echo "イベント名: ${{ github.event_name }}"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::手動実行モード"
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            
            # 手動実行時は常にビルド
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            
            # 入力パラメータの処理
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            if [[ -z "$FORCE_REBUILD" || "$FORCE_REBUILD" == "true" ]]; then
              echo "FORCE_REBUILD=true" >> $GITHUB_ENV
            else
              echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            fi
            
            # ビルドタイプの処理
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            if [[ -z "$BUILD_TYPE" ]]; then
              BUILD_TYPE="release"
            fi
            echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
            
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "::notice::スケジュール実行モード"
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            
          else
            echo "::notice::その他のトリガー: ${{ github.event_name }}"
            echo "TRIGGER_TYPE=other" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          fi
          
          echo "設定完了:"
          echo "  TRIGGER_TYPE=$TRIGGER_TYPE"
          echo "  BUILD_NEEDED=$BUILD_NEEDED"
          echo "  FORCE_REBUILD=$FORCE_REBUILD"
          echo "  BUILD_TYPE=$BUILD_TYPE"

      # ステップ4: スケジュール実行時のチェック
      - name: Check for Scheduled Build
        if: env.TRIGGER_TYPE == 'scheduled'
        id: schedule-check
        run: |
          echo "=== スケジュール実行チェック ==="
          
          # アップストリームから最新コミットを取得
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "想定タグ名: $BASE_TAG"
          
          # 既存のタグをチェック
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "::notice::既存ビルドあり - スキップします"
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            echo "::notice::新規ビルドが必要です"
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          fi

      # ステップ5: 手動実行時の設定
      - name: Setup Manual Build
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        id: manual-setup
        run: |
          echo "=== 手動実行設定 ==="
          
          # アップストリームから最新コミットを取得
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "アップストリーム最新コミット: $SHORT_SHA"
          echo "ベースタグ名: $BASE_TAG"
          
          # 環境変数の設定
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          # 強制再ビルドかどうかでタグ名を決定
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
            echo "::notice::強制上書きモード - 既存タグを上書きします"
          else
            # 手動実行用の一意なタグ名を生成
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            echo "::notice::新規ビルドモード - 新しいタグを作成します"
          fi
          
          echo "最終タグ名: $TARGET_TAG"

      # ステップ6: その他のトリガー時の設定
      - name: Setup Other Trigger Build
        if: env.TRIGGER_TYPE == 'other' && env.BUILD_NEEDED == 'true'
        id: other-setup
        run: |
          echo "=== その他のトリガー設定 ==="
          
          # 現在のコミットを使用
          CURRENT_SHA="${{ github.sha }}"
          SHORT_SHA=${CURRENT_SHA:0:7}
          
          # イベントに基づいたタグ名を生成
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TARGET_TAG="build-$SHORT_SHA-push-$TIMESTAMP"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            TARGET_TAG="build-pr-$PR_NUMBER-$TIMESTAMP"
          else
            TARGET_TAG="build-$SHORT_SHA-$TIMESTAMP"
          fi
          
          echo "UPSTREAM_SHA=$CURRENT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          
          echo "トリガー: ${{ github.event_name }}"
          echo "タグ名: $TARGET_TAG"

      # ステップ7: ビルド不要な場合は終了
      - name: Skip Build if Not Needed
        if: env.BUILD_NEEDED != 'true'
        run: |
          echo "=== ビルド不要 ==="
          echo "現在のコミットに対するビルドは既に存在します。"
          echo "ビルドをスキップします。"
          exit 0

      # ステップ8: ビルド日時取得
      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "ビルド日時を取得中..."
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
          echo "date_short=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV

      # ステップ9: ソースコード取得
      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== ソースコード取得 ==="
          
          # Git設定
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # アップストリームリポジトリを追加
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || echo "アップストリームは既に追加済み"
          
          # アップストリームからフェッチ
          echo "アップストリームからフェッチ中..."
          git fetch upstream
          
          # 指定のコミットにチェックアウト
          echo "コミット $UPSTREAM_SHA をチェックアウト"
          git checkout $UPSTREAM_SHA
          
          # 確認
          echo "現在のコミット:"
          git log --oneline -1

      # ステップ10: Java環境セットアップ
      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ11: Android SDKセットアップ
      - name: Setup Android SDK
        if: env.BUILD_NEEDED == 'true'
        uses: android-actions/setup-android@v3

      # ステップ12: パッケージ名置換（LSPatch対応版）
      - name: Replace Package Names for LSPatch
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用パッケージ名置換 ==="
          
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          NEW_PKG="io.github.fork.lime"
          NEW_LINE_PKG="jp.naver.line.android.clone"
          
          echo "置換設定:"
          echo "  $OLD_PKG → $NEW_PKG"
          echo "  $OLD_LINE → $NEW_LINE_PKG"
          
          # AndroidManifest.xmlの処理
          echo "1. AndroidManifest.xmlの処理..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              echo "  処理中: $file"
              # 安全な置換
              sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
              sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            done
          
          # その他のファイル処理
          echo "2. その他ファイルの処理..."
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.properties" \) \
            ! -path "*/build/*" ! -path "*/.git/*" ! -name "AndroidManifest.xml" 2>/dev/null | \
            while read file; do
              if [[ -f "$file" ]]; then
                sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file" 2>/dev/null || true
                sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file" 2>/dev/null || true
              fi
            done
          
          echo "パッケージ名置換完了"

      # ステップ13: LINE-Neoマニフェストにxposedscopeを追加
      - name: Add xposedscope to LINE-Neo Manifest
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LINE-Neoマニフェストにxposedscopeを追加 ==="
          
          # LINE-Neoのマニフェストを検索
          TARGET_MANIFEST=$(find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            xargs grep -l "jp.naver.line.android" 2>/dev/null | head -1)
          
          if [[ -z "$TARGET_MANIFEST" ]]; then
            TARGET_MANIFEST=$(find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | head -1)
          fi
          
          if [[ -n "$TARGET_MANIFEST" ]]; then
            echo "ターゲットマニフェスト: $TARGET_MANIFEST"
            
            # 既存のxposedscopeを削除
            sed -i '/android:name="xposedscope"/d' "$TARGET_MANIFEST"
            
            # applicationタグの直後にxposedscopeを追加
            APP_LINE=$(grep -n '<application' "$TARGET_MANIFEST" | head -1 | cut -d: -f1)
            
            if [[ -n "$APP_LINE" ]]; then
              sed -i "${APP_LINE}a\\
              <meta-data\\
                  android:name=\\"xposedscope\\"\\
                  android:value=\\"io.github.fork.lime\\" />" "$TARGET_MANIFEST"
              
              echo "  ✓ xposedscopeを追加: io.github.fork.lime"
            fi
          fi

      # ステップ14: アプリ名の統一設定
      - name: Unify Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アプリ名の統一設定 ==="
          
          # マニフェストファイルでアプリ名を統一
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            done
          
          # strings.xmlのapp_nameも更新
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            done

      # ステップ15: Gradle権限設定
      - name: Set Gradle Permissions
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== Gradle権限設定 ==="
          if [[ -f "gradlew" ]]; then
            chmod +x gradlew
            echo "gradlewに実行権限を付与"
          fi

      # ステップ16: APKビルド実行
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルド実行 ==="
          
          # ビルドタイプに基づいてビルド
          BUILD_COMMANDS=()
          
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            BUILD_COMMANDS+=("assembleRelease")
          fi
          
          if [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "both" ]]; then
            BUILD_COMMANDS+=("assembleDebug")
          fi
          
          echo "実行するビルドコマンド: ${BUILD_COMMANDS[@]}"
          
          # クリーンビルド
          ./gradlew clean 2>&1 | tail -20 || echo "クリーンビルド警告"
          
          # 各ビルドを実行
          for cmd in "${BUILD_COMMANDS[@]}"; do
            echo "実行中: ./gradlew $cmd"
            if ./gradlew $cmd --stacktrace --no-daemon 2>&1; then
              echo "✅ $cmd 成功"
              echo "BUILD_RESULT=${cmd#assemble}" >> $GITHUB_ENV
            else
              echo "❌ $cmd 失敗"
              # 失敗時はデバッグ情報を出力
              ./gradlew $cmd --stacktrace 2>&1 | tail -100
              exit 1
            fi
          done
          
          # 生成されたAPKを表示
          echo "生成されたAPKファイル:"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            SIZE=$(du -h "$apk" | cut -f1)
            echo "  - $apk ($SIZE)"
          done

      # ステップ17: GitHubリリース作成
      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo ${{ env.SHORT_SHA }} (${{ env.BUILD_DATE }})
          body: |
            # 🚀 LIMEs-Neo - LSPatch対応ビルド
            
            ## 📋 ビルド情報
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
            - **ビルド種別**: ${{ env.BUILD_TYPE }}
            - **トリガー**: ${{ env.TRIGGER_TYPE }}
            - **タグ**: ${{ env.TARGET_TAG }}
            
            ## 🎯 LSPatch設定
            **ターゲットAPK**: `jp.naver.line.android.clone` (LIMEs-Neo)
            **モジュール**: `io.github.fork.lime`
            
            ## 🔧 変更点
            1. パッケージ名を変更してオリジナルアプリと競合しないようにしました
            2. LSPatch用にxposedscopeを適切に設定
            3. アプリ名を統一
            
            ## 📦 ダウンロード
            以下のAPKファイルが利用可能です。
            
            ## ⚠️ 注意事項
            - LSPatch 1.10.2以上を使用してください
            - 埋め込みモードでの適用を推奨します
            
            ---
            *GitHub Actionsによる自動ビルド*
          draft: false
          prerelease: false
          overwrite: ${{ env.FORCE_REBUILD == 'true' && true || false }}
          files: |
            **/build/outputs/apk/**/*.apk
            *.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ18: ビルド完了通知
      - name: Build Completion Notification
        if: always()
        run: |
          echo "=== ビルド完了 ==="
          echo "ステータス: ${{ job.status }}"
          echo ""
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド成功！"
            echo ""
            echo "📊 サマリー:"
            echo "- アプリ名: LIMEs-Neo"
            echo "- ターゲットパッケージ: $NEW_LINE_PKG"
            echo "- モジュールパッケージ: $NEW_PKG"
            echo "- ビルドタグ: ${{ env.TARGET_TAG || '未設定' }}"
            echo "- ビルド日時: ${{ env.BUILD_DATE || '不明' }}"
            
            # リリースリンク
            if [[ -n "${{ env.TARGET_TAG }}" ]]; then
              echo ""
              echo "🔗 リリースページ:"
              echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"
            fi
          else
            echo "❌ ビルド失敗"
            echo ""
            echo "🔧 デバッグ情報:"
            echo "- イベント: ${{ github.event_name }}"
            echo "- トリガー: ${{ env.TRIGGER_TYPE || '不明' }}"
            echo "- ワークフロー: ${{ github.workflow }}"
            echo "- リポジトリ: ${{ github.repository }}"
          fi

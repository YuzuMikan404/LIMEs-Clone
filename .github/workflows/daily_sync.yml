name: LIMEs-Neo Daily Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: true
        type: boolean
      build_type:
        description: 'ビルドタイプ'
        required: false
        default: 'release'
        type: string
        options:
          - release
          - debug
          - both
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      APP_NAME: "LIMEs-Neo"

    steps:
      - name: Debug Workflow Dispatch Inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GitHub Event Name: ${{ github.event_name }}"

      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Determine Trigger Type
        id: trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "FORCE_REBUILD=${{ github.event.inputs.force_rebuild }}" >> $GITHUB_ENV
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
            [[ -z "$BUILD_TYPE" ]] && BUILD_TYPE="release"
            echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          else
            echo "TRIGGER_TYPE=other" >> $GITHUB_ENV
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Get Build Datetime
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV
          
          # タグ名生成
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "TARGET_TAG=build-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV

      - name: Fetch Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || true
          git fetch upstream
          # 最新を取得
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          git checkout $UPSTREAM_SHA

      - name: Setup Java
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: env.BUILD_NEEDED == 'true'
        uses: android-actions/setup-android@v3

      # === 【重要】デバッグ用：変更前の状態を保存 ===
      - name: Save Files Before Modification (Debug)
        if: env.BUILD_NEEDED == 'true'
        run: |
          mkdir -p debug_artifacts/before
          
          echo "保存中: AndroidManifest.xml"
          find . -name "AndroidManifest.xml" ! -path "*/build/*" -exec cp --parents {} debug_artifacts/before/ \;
          
          echo "保存中: 主要なKotlinファイル (ConstantsやHook関連)"
          find . -name "*.kt" ! -path "*/build/*" | head -n 20 | xargs -I {} cp --parents {} debug_artifacts/before/

      # === 置換処理の実行 ===
      - name: Apply Package & Scope Changes
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 変更処理開始 ==="
          
          OLD_PKG="io.github.hiro.lime"
          NEW_PKG="io.github.fork.lime"
          
          # 1. モジュール自体のパッケージ名を変更
          echo "パッケージ名置換: $OLD_PKG -> $NEW_PKG"
          find . -type f \( -name "*.xml" -o -name "*.java" -o -name "*.kt" -o -name "*.gradle" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} +

          # 2. AndroidManifest.xml の xposedscope を強制書き換え
          #    LSPatchがcloneアプリを認識するために必須
          echo "AndroidManifestのスコープ修正"
          TARGET_SCOPE="jp.naver.line.android.clone"
          
          find . -name "AndroidManifest.xml" ! -path "*/build/*" | while read manifest; do
            echo "Processing: $manifest"
            # 元の xposedscope 行を検索して、ターゲットの値を書き換える
            # 注意: 元の値が jp.naver.line.android であることを前提としています
            sed -i 's|android:value="jp.naver.line.android"|android:value="jp.naver.line.android.clone"|g' "$manifest"
            
            # 確認用ログ
            grep "xposedscope" "$manifest" || echo "WARNING: xposedscope not found in $manifest"
          done

          # 3. ソースコードのロジック緩和
          #    jp.naver.line.android (公式) と .clone (クローン) 両方で動作するように
          echo "ソースコードの判定ロジック緩和"
          
          # パッケージ名チェックを startsWith に変更
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|== "jp.naver.line.android"|.startsWith("jp.naver.line.android")|g' {} +
             
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|!= "jp.naver.line.android"|!it.packageName.startsWith("jp.naver.line.android")|g' {} +
             
          find . -type f \( -name "*.kt" -o -name "*.java" \) ! -path "*/build/*" \
             -exec sed -i 's|equals("jp.naver.line.android")|startsWith("jp.naver.line.android")|g' {} +

          echo "=== 変更処理完了 ==="

      # === 【重要】デバッグ用：変更後の状態を保存 ===
      - name: Save Files After Modification (Debug)
        if: env.BUILD_NEEDED == 'true'
        run: |
          mkdir -p debug_artifacts/after
          
          echo "保存中: AndroidManifest.xml"
          find . -name "AndroidManifest.xml" ! -path "*/build/*" -exec cp --parents {} debug_artifacts/after/ \;
          
          echo "保存中: 主要なKotlinファイル"
          find . -name "*.kt" ! -path "*/build/*" | head -n 20 | xargs -I {} cp --parents {} debug_artifacts/after/
          
          # 差分比較用のZIP作成
          zip -r debug_files.zip debug_artifacts/

      - name: Unify Application Name
        if: env.BUILD_NEEDED == 'true'
        run: |
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            done
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            done

      - name: Set Gradle Permissions
        if: env.BUILD_NEEDED == 'true'
        run: |
          if [[ -f "gradlew" ]]; then chmod +x gradlew; fi

      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          ./gradlew clean || true
          
          if [[ "$BUILD_TYPE" == "release" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleRelease --no-daemon
          fi
          if [[ "$BUILD_TYPE" == "debug" || "$BUILD_TYPE" == "both" ]]; then
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Create GitHub Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Debug Build ${{ env.SHORT_SHA }}
          body: |
            # 🛠 Debug Build
            
            うまく動作しない場合のデバッグ用ビルドです。
            
            ## 📂 デバッグ方法
            添付されている `debug_files.zip` をダウンロード・解凍してください。
            - `before/`: 置換前のファイル
            - `after/`: 置換後のファイル
            
            これらを比較して、`AndroidManifest.xml` の `xposedscope` が正しく `jp.naver.line.android.clone` になっているか確認できます。
            
            ## ビルド情報
            - Tag: ${{ env.TARGET_TAG }}
            - Target: jp.naver.line.android.clone
          draft: false
          prerelease: false
          files: |
            **/build/outputs/apk/**/*.apk
            *.apk
            debug_files.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

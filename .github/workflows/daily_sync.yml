name: LIMEs-Neo Local Mode Build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: true
        type: boolean
      build_type:
        description: 'ビルドタイプ'
        required: false
        default: 'debug'
        type: string
        options:
          - debug
          - release

permissions:
  contents: write
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  local-mode-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"
      APP_NAME: "LIMEs-Neo"

    steps:
      # ステップ1: リポジトリチェックアウト
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      # ステップ2: 手動実行設定
      - name: Setup Manual Build
        id: manual-setup
        run: |
          echo "=== ローカルモードビルド設定 ==="
          
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "::error::アップストリーム取得失敗"
            exit 1
          fi
          
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="local-build-$SHORT_SHA"
          
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
          if [[ -z "$FORCE_REBUILD" || "$FORCE_REBUILD" == "true" ]]; then
            echo "FORCE_REBUILD=true" >> $GITHUB_ENV
          else
            echo "FORCE_REBUILD=false" >> $GITHUB_ENV
          fi
          
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [[ -z "$BUILD_TYPE" ]]; then
            BUILD_TYPE="debug"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            TARGET_TAG="${BASE_TAG}"
          else
            TARGET_TAG="${BASE_TAG}-${TIMESTAMP}"
          fi
          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          
          echo "ビルドタイプ: $BUILD_TYPE"
          echo "タグ名: $TARGET_TAG"

      # ステップ3: ビルド日時取得
      - name: Get Build Datetime
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT
          echo "date_short=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +'%H:%M:%S')" >> $GITHUB_ENV

      # ステップ4: ソースコード取得
      - name: Fetch Source Code
        run: |
          echo "=== ソースコード取得 ==="
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git" || echo "アップストリームは既に追加済み"
          
          echo "アップストリームからフェッチ中..."
          git fetch upstream
          
          echo "コミット $UPSTREAM_SHA をチェックアウト"
          git checkout $UPSTREAM_SHA
          
          echo "現在のコミット:"
          git log --oneline -1

      # ステップ5: Java環境セットアップ
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ6: Android SDKセットアップ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ステップ7: パッケージ名置換（簡易版）
      - name: Replace Package Names for Local Mode
        run: |
          echo "=== ローカルモード用パッケージ名置換 ==="
          
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          NEW_PKG="io.github.fork.lime"
          NEW_LINE_PKG="jp.naver.line.android.clone"
          
          echo "置換設定:"
          echo "  $OLD_PKG → $NEW_PKG"
          echo "  $OLD_LINE → $NEW_LINE_PKG"
          
          # AndroidManifest.xmlの修正
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i "s|$OLD_PKG|$NEW_PKG|g" "$file"
              sed -i "s|$OLD_LINE|$NEW_LINE_PKG|g" "$file"
            done
          
          # Javaファイルのパッケージ宣言
          find . -type f -name "*.java" ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              if grep -q "^package $OLD_PKG;" "$file"; then
                sed -i "s|^package $OLD_PKG;|package $NEW_PKG;|g" "$file"
              fi
            done
          
          # Main.javaのTARGET_PACKAGE定数
          find . -name "Main.java" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              if [[ -f "$file" ]]; then
                sed -i "s|private static final String TARGET_PACKAGE = \".*\";|private static final String TARGET_PACKAGE = \"$NEW_LINE_PKG\";|g" "$file"
                sed -i "s|\"$OLD_LINE\"|\"$NEW_LINE_PKG\"|g" "$file"
              fi
            done
          
          echo "パッケージ名置換完了"

      # ステップ8: アプリ名の統一設定
      - name: Unify Application Name
        run: |
          echo "=== アプリ名の統一設定 ==="
          
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|android:label="[^"]*"|android:label="LIMEs-Neo (Local)"|g' "$file"
            done
          
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" 2>/dev/null | \
            while read file; do
              sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo (Local)</string>|g' "$file"
            done

      # ステップ9: Gradle権限設定
      - name: Set Gradle Permissions
        run: |
          echo "=== Gradle権限設定 ==="
          if [[ -f "gradlew" ]]; then
            chmod +x gradlew
            echo "gradlewに実行権限を付与"
          fi

      # ステップ10: APKビルド実行
      - name: Build APK for Local Mode
        run: |
          echo "=== ローカルモード用APKビルド実行 ==="
          
          # クリーンビルド
          echo "クリーンビルドを実行..."
          ./gradlew clean 2>&1 | tail -30
          
          # ビルド実行
          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "リリースビルドを実行..."
            BUILD_COMMAND="assembleRelease"
          else
            echo "デバッグビルドを実行..."
            BUILD_COMMAND="assembleDebug"
          fi
          
          echo "実行コマンド: ./gradlew $BUILD_COMMAND"
          
          if ./gradlew $BUILD_COMMAND --stacktrace --no-daemon 2>&1 | tee build.log; then
            echo "✅ ビルド成功"
          else
            echo "❌ ビルド失敗"
            tail -100 build.log
            exit 1
          fi
          
          # APKファイルの存在確認
          echo "=== APKファイル確認 ==="
          
          if [[ "$BUILD_TYPE" == "release" ]]; then
            APK_PATH="app/build/outputs/apk/release"
          else
            APK_PATH="app/build/outputs/apk/debug"
          fi
          
          echo "検索パス: $APK_PATH"
          
          if [[ -d "$APK_PATH" ]]; then
            echo "ディレクトリ内のファイル:"
            ls -la "$APK_PATH/"
            
            APK_FILES=$(find "$APK_PATH" -name "*.apk" -type f)
            if [[ -n "$APK_FILES" ]]; then
              echo "✅ APKファイルを発見:"
              echo "$APK_FILES"
              
              # ファイルサイズを表示
              for apk in $APK_FILES; do
                SIZE=$(du -h "$apk" | cut -f1)
                echo "  - $apk ($SIZE)"
              done
              
              # 環境変数にAPKパスを保存
              echo "APK_FILES=$APK_FILES" >> $GITHUB_ENV
            else
              echo "❌ APKファイルが見つかりません"
              exit 1
            fi
          else
            echo "❌ APKディレクトリが存在しません: $APK_PATH"
            echo "ビルド出力ディレクトリを検索..."
            find . -name "*.apk" -type f 2>/dev/null | head -10
            exit 1
          fi

      # ステップ11: APK情報表示
      - name: Display APK Info
        if: success()
        run: |
          echo "=== APK詳細情報 ==="
          
          # 最初のAPKファイルを取得
          FIRST_APK=$(echo "$APK_FILES" | head -1)
          
          if [[ -n "$FIRST_APK" && -f "$FIRST_APK" ]]; then
            echo "メインAPK: $FIRST_APK"
            echo "ファイルサイズ: $(du -h "$FIRST_APK" | cut -f1)"
            
            # APK内のAndroidManifest.xmlを確認
            echo "xposedscope値確認:"
            unzip -p "$FIRST_APK" AndroidManifest.xml 2>/dev/null | \
              strings 2>/dev/null | grep -B1 -A1 -i "xposedscope" || echo "  確認不可"
            
            # パッケージ名確認
            echo "パッケージ名確認:"
            unzip -p "$FIRST_APK" AndroidManifest.xml 2>/dev/null | \
              strings 2>/dev/null | grep -i "package=" || echo "  確認不可"
          else
            echo "APKファイルが選択できません"
          fi

      # ステップ12: GitHubリリース作成（APK添付修正版）
      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Local Mode ${{ env.SHORT_SHA }} (${{ env.BUILD_DATE }})
          body: |
            # 🚀 LIMEs-Neo - ローカルモード用ビルド
            
            ## 📋 ビルド情報
            - **ソースコミット**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}
            - **ビルド種別**: ${{ env.BUILD_TYPE }}
            - **タグ**: ${{ env.TARGET_TAG }}
            
            ## 🎯 ローカルモード設定
            **ターゲットAPK**: `jp.naver.line.android.clone` (LINE-Neo)
            **モジュールAPK**: `io.github.fork.lime` (LIMEs-Neo)
            **xposedscope値**: `jp.naver.line.android.clone`
            
            ## 📦 ダウンロード
            以下のAPKファイルをダウンロードして端末にインストールしてください。
            
            ## 🔧 ローカルモード使用方法
            1. **LINE-Neo** (`jp.naver.line.android.clone`) をインストール
            2. このAPKファイルをインストール（LIMEs-Neoモジュール）
            3. **LSPatch** アプリを開く
            4. 「管理」→ LINE-Neoを選択
            5. 「モジュール」→ LIMEs-Neoを有効化
            6. LINE-Neoを再起動
            
            ## ⚠️ 注意事項
            - ローカルモードでは埋め込みパッチは不要です
            - LINE-Neoがインストール済みであることを確認
            - モジュール有効化後は必ずアプリを再起動
            
            ---
            *自動ビルド - APK添付済み*
          draft: false
          prerelease: false
          overwrite: ${{ env.FORCE_REBUILD == 'true' && true || false }}
          files: |
            ${{ env.APK_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ13: ビルド完了通知
      - name: Build Completion Notification
        if: always()
        run: |
          echo "=== ビルド完了 ==="
          echo "ステータス: ${{ job.status }}"
          echo ""
          
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド成功！"
            echo ""
            echo "📊 ビルドサマリー:"
            echo "- アプリ名: LIMEs-Neo (Local)"
            echo "- ターゲットパッケージ: $NEW_LINE_PKG"
            echo "- モジュールパッケージ: $NEW_PKG"
            echo "- ビルド種別: ${{ env.BUILD_TYPE }}"
            echo "- APKファイル数: $(echo $APK_FILES | wc -w)"
            echo "- ビルド日時: ${{ env.BUILD_DATE }} ${{ env.BUILD_TIME }}"
            
            # APKファイル一覧
            echo ""
            echo "📦 生成されたAPKファイル:"
            for apk in $APK_FILES; do
              if [[ -f "$apk" ]]; then
                SIZE=$(du -h "$apk" | cut -f1)
                echo "  - $(basename "$apk") ($SIZE)"
              fi
            done
            
            if [[ -n "${{ env.TARGET_TAG }}" ]]; then
              echo ""
              echo "🔗 リリースページ:"
              echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.TARGET_TAG }}"
            fi
          else
            echo "❌ ビルド失敗"
            echo ""
            echo "🔧 デバッグ情報:"
            echo "- イベント: ${{ github.event_name }}"
            echo "- ビルドタイプ: ${{ env.BUILD_TYPE || '不明' }}"
            
            if [[ -f "build.log" ]]; then
              echo ""
              echo "📝 ビルドログのエラー:"
              grep -i "error:" build.log | head -5 || echo "エラー箇所が見つかりません"
            fi
          fi

name: LIMEs-Neo Daily Build - LSPatch Fixed

permissions:
  contents: write
  packages: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '既存のビルドを上書きして強制再ビルド'
        required: false
        default: 'false'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: areteruhiro/PrtivateLIMEs
      MY_PAT: ${{ secrets.PAT }}
      NEW_PKG: "io.github.fork.lime"
      NEW_LINE_PKG: "jp.naver.line.android.clone"  # 正しいパッケージ名
      APP_NAME: "LIMEs-Neo"

    steps:
      # ステップ1: Checkout
      - name: Checkout Local Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # ステップ2: Trigger Check
      - name: Check Trigger Type
        id: trigger-check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "TRIGGER_TYPE=manual" >> $GITHUB_ENV
            FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
            echo "FORCE_REBUILD=$FORCE_REBUILD" >> $GITHUB_ENV
          else
            echo "TRIGGER_TYPE=scheduled" >> $GITHUB_ENV
          fi

      # ステップ3: Check Upstream
      - name: Check Upstream for Scheduled Runs
        if: env.TRIGGER_TYPE == 'scheduled'
        id: check-upstream
        run: |
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          if git ls-remote --tags origin "refs/tags/$BASE_TAG" >/dev/null 2>&1; then
            echo "BUILD_NEEDED=false" >> $GITHUB_ENV
          else
            echo "BUILD_NEEDED=true" >> $GITHUB_ENV
            echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
            echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          fi

      # ステップ4: Manual Run Setup
      - name: Setup Manual Run
        if: env.TRIGGER_TYPE == 'manual' && env.BUILD_NEEDED == 'true'
        run: |
          AUTH_URL="https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          UPSTREAM_SHA=$(git ls-remote "$AUTH_URL" HEAD | awk '{print $1}')
          SHORT_SHA=${UPSTREAM_SHA:0:7}
          BASE_TAG="build-$SHORT_SHA"
          
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "TARGET_TAG=$BASE_TAG" >> $GITHUB_ENV
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TARGET_TAG="${BASE_TAG}-manual-${TIMESTAMP}"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          fi

      # ステップ5: Get datetime
      - name: Get build datetime
        if: env.BUILD_NEEDED == 'true'
        id: datetime
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      # ステップ6: Fetch Source
      - name: Fetch & Checkout Upstream Source Code
        if: env.BUILD_NEEDED == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add upstream "https://x-access-token:${MY_PAT}@github.com/${SOURCE_REPO}.git"
          git fetch upstream
          git checkout $UPSTREAM_SHA

      # ステップ7: 基本パッケージ名置換
      - name: Basic Package Name Replacement
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== 基本パッケージ名置換 ==="
          
          OLD_PKG="io.github.hiro.lime"
          OLD_LINE="jp.naver.line.android"
          
          # Java/Kotlinファイル
          find . -type f \( -name "*.java" -o -name "*.kt" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} + 2>/dev/null || true
          
          # XMLファイル
          find . -type f -name "*.xml" \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} + 2>/dev/null || true
          
          # Gradleファイル
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec sed -i "s|$OLD_PKG|$NEW_PKG|g" {} + 2>/dev/null || true

      # ステップ8: 【重要】LSPatch用修正 - xposedscopeの修正
      - name: Fix LSPatch Issues
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用修正 ==="
          
          echo "1. xposedscopeの値を修正..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            echo "処理: $file"
            
            # xposedscopeの値を修正（.clone.clone → .clone）
            if grep -q 'android:name="xposedscope"' "$file"; then
              echo "  xposedscopeを検出"
              
              # 現在の値を確認
              CURRENT_VALUE=$(grep -o 'android:value="[^"]*"' "$file" | grep -A1 'xposedscope' | tail -1 | cut -d'"' -f2)
              echo "  現在の値: $CURRENT_VALUE"
              
              # 正しい値に修正
              sed -i 's|android:value="jp\.naver\.line\.android\.clone\.clone"|android:value="jp.naver.line.android.clone"|g' "$file"
              sed -i 's|android:value="jp.naver.line.android.clone.clone"|android:value="jp.naver.line.android.clone"|g' "$file"
              
              # 修正後の確認
              NEW_VALUE=$(grep -o 'android:value="[^"]*"' "$file" | grep -A1 'xposedscope' | tail -1 | cut -d'"' -f2)
              echo "  修正後: $NEW_VALUE"
            fi
            
            echo ""
          done
          
          echo "2. アプリラベルを直接設定..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            # リソース参照を直接名前に置換
            sed -i 's|android:label="@0x640e009e"|android:label="LIMEs-Neo"|g' "$file"
            sed -i 's|android:label="@[^"]*"|android:label="LIMEs-Neo"|g' "$file"
            
            echo "  アプリラベルを設定: $file"
          done
          
          echo "3. LINEパッケージ名の置換確認..."
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            # まだ残っている可能性のある元のLINEパッケージ名を置換
            sed -i 's|jp\.naver\.line\.android|jp.naver.line.android.clone|g' "$file"
            sed -i 's|jp/naver/line/android|jp/naver/line/android/clone|g' "$file"
          done

      # ステップ9: アプリ名の確実な設定
      - name: Set App Name Reliably
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== アプリ名設定 ==="
          
          # strings.xmlの置換
          find . -name "strings.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | while read file; do
            echo "処理: $file"
            
            # 既存のapp_nameを置換
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">LIMEs-Neo</string>|g' "$file"
            
            # 存在しない場合は追加
            if ! grep -q 'name="app_name"' "$file"; then
              if grep -q "<resources>" "$file"; then
                sed -i 's|<resources>|<resources>\n    <string name="app_name">LIMEs-Neo</string>|' "$file"
                echo "  app_nameを追加"
              fi
            fi
          done
          
          # その他のリソースファイルも確認
          find . -type f -name "*.xml" ! -path "*/build/*" ! -path "*/.git/*" -exec grep -l "LIMEs\|lime" {} \; 2>/dev/null | while read file; do
            # 元のアプリ名参照を置換
            sed -i 's|LIMEs[^"]*|LIMEs-Neo|g' "$file" 2>/dev/null || true
          done

      # ステップ10: 置換結果の検証
      - name: Verify Fixes for LSPatch
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== LSPatch用設定検証 ==="
          
          echo "1. AndroidManifest.xml の確認:"
          find . -name "AndroidManifest.xml" -type f ! -path "*/build/*" ! -path "*/.git/*" | head -1 | while read file; do
            echo "ファイル: $file"
            echo ""
            echo "パッケージ:"
            grep 'package="' "$file"
            echo ""
            echo "アプリラベル:"
            grep 'android:label=' "$file"
            echo ""
            echo "xposedscope:"
            grep -A1 -B1 'xposedscope' "$file"
            echo ""
            echo "LSPatch認識用確認:"
            echo "- パッケージ名: $NEW_PKG"
            echo "- xposedscope: jp.naver.line.android.clone (正しい値)"
            echo "- アプリ名: LIMEs-Neo"
          done
          
          echo ""
          echo "2. build.gradle の確認:"
          find . -name "build.gradle" -o -name "*.gradle.kts" | head -2 | while read file; do
            echo "ファイル: $file"
            grep -n "applicationId" "$file" || true
          done

      # ステップ11: Java Setup
      - name: Setup Java Environment
        if: env.BUILD_NEEDED == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ステップ12: Build APK
      - name: Build APK
        if: env.BUILD_NEEDED == 'true'
        run: |
          echo "=== APKビルド ==="
          
          chmod +x gradlew
          
          echo "クリーンビルド..."
          ./gradlew clean || echo "クリーン失敗（続行）"
          
          echo "リリースビルド..."
          if ./gradlew assembleRelease --stacktrace; then
            echo "BUILD_RESULT=release" >> $GITHUB_ENV
            echo "✅ リリースビルド成功"
          else
            echo "デバッグビルド..."
            if ./gradlew assembleDebug --stacktrace; then
              echo "BUILD_RESULT=debug" >> $GITHUB_ENV
              echo "⚠️ デバッグビルド成功"
            else
              echo "❌ ビルド失敗"
              exit 1
            fi
          fi

      # ステップ13: Create Release
      - name: Create Release
        if: env.BUILD_NEEDED == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: LIMEs-Neo Build ${{ env.SHORT_SHA }} (LSPatch Fixed)
          body: |
            # LIMEs-Neo - LSPatch修正版
            
            ## 🔧 修正内容
            以下の問題を修正しました：
            
            1. **xposedscopeの値修正**
               - 修正前: `jp.naver.line.android.clone.clone`
               - 修正後: `jp.naver.line.android.clone`
            
            2. **アプリラベルの直接設定**
               - リソース参照(`@0x640e009e`)を直接`LIMEs-Neo`に設定
            
            3. **LSPatch認識最適化**
               - パッケージ名の一貫性を確保
            
            ## 📋 ビルド情報
            - **アプリ名**: LIMEs-Neo
            - **パッケージ名**: `io.github.fork.lime`
            - **LSPatch対象**: `jp.naver.line.android.clone`
            - **ソース**: [${{ env.SHORT_SHA }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.UPSTREAM_SHA }})
            - **ビルド日時**: ${{ steps.datetime.outputs.date }}
            
            ## 🚀 LSPatch設定
            **必ず以下の設定で適用してください：**
            
            ```
            元のAPKパッケージ名: jp.naver.line.android.clone
            モード: 埋め込み（推奨）
            署名: 元の署名を維持
            ```
            
            ## ✅ 確認事項
            - [x] xposedscopeが正しい値に設定
            - [x] アプリ名がLIMEs-Neoに変更
            - [x] パッケージ名が一貫性を保持
            
            ---
            *LSPatch認識問題を修正したビルド*
          draft: false
          prerelease: false
          overwrite: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ステップ14: Build Complete
      - name: Build Complete
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ ビルド完了 - LSPatch修正版"
            echo ""
            echo "📋 LSPatch設定確認:"
            echo "1. 元のAPKパッケージ名: jp.naver.line.android.clone"
            echo "2. xposedscope値: jp.naver.line.android.clone"
            echo "3. アプリ名: LIMEs-Neo"
            echo ""
            echo "⚠️ 注意: 古いビルドとは異なる設定です"
          else
            echo "❌ ビルド失敗"
          fi
